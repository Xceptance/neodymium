<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title ?: 'Aura Report Manager'}">Neodymium Aura Report Manager</title>

    <!-- Google Fonts: Outfit, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- HTMX 1.9.10 -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Custom Modular CSS -->
    <link rel="stylesheet" th:href="@{/css/report-manager.css}" href="css/report-manager.css">
</head>
<body>

    <!-- Left Collapsible Sidebar Navigation Fragment -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- Main Content Area -->
    <main id="appMain">
        <!-- Top Header Fragment -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- Dynamic View Body Swapped via HTMX or Tabs -->
        <div class="content-body" id="mainViewContainer" th:switch="${activeTab}">
            <th:block th:case="'BatchHistory'">
                <div th:replace="~{fragments/batch-history :: batchHistory}"></div>
            </th:block>
            <th:block th:case="'RunReport'">
                <div th:replace="~{fragments/run-report :: runReport}"></div>
            </th:block>
            <th:block th:case="'TestBase'">
                <div th:replace="~{fragments/test-base :: testBase}"></div>
            </th:block>
            <th:block th:case="*">
                <div th:replace="~{fragments/batch-overview :: batchOverview}"></div>
            </th:block>
        </div>
    </main>

    <!-- Allure-style Draggable Panel Resizer & Side Panel Inspector Drawer Fragment -->
    <div class="panel-resizer" id="allurePanelResizer"></div>
    <div th:replace="~{fragments/side-panel-step-list :: stepListPanel}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Modular Unobtrusive JavaScript Controller -->
    <script th:src="@{/js/report-manager.js}" src="js/report-manager.js"></script>
</body>
</html>
