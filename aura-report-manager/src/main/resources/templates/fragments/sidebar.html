<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Collapsible Sidebar Navigation Fragment -->
<aside th:fragment="sidebar" id="mainSidebar">
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebarCollapse()" title="Collapse / Expand Navigation Panel">
        <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <div class="logo-container">
        <div class="logo-icon"><span class="material-symbols-outlined">trending_up</span></div>
        <div class="logo-text">Aura <span>ReportManager</span></div>
    </div>

    <div class="nav-group-label">Report Manager</div>
    <nav>
        <button class="nav-item-btn" id="navRunsList" 
                th:classappend="${activeTab == 'Directory'} ? ' active' : ''"
                hx-get="/batch-overview" 
                hx-target="#mainViewContainer" 
                hx-swap="innerHTML"
                hx-push-url="true"
                onclick="setActiveNavBtn(this)"
                title="Overview of Runs">
            <span class="material-symbols-outlined">format_list_bulleted</span> <span>Overview of Runs</span>
        </button>

        <button class="nav-item-btn" id="navTestBase" 
                th:classappend="${activeTab == 'TestBase'} ? ' active' : ''"
                hx-get="/test-base" 
                hx-target="#mainViewContainer" 
                hx-swap="innerHTML"
                hx-push-url="true"
                onclick="setActiveNavBtn(this)"
                title="Comprehensive Test Base">
            <span class="material-symbols-outlined">database</span> <span>Test Base</span>
        </button>
    </nav>

    <div class="nav-group-label" style="margin-top: 1rem;">Test Automation</div>
    <nav>
        <button class="nav-item-btn" id="navAuraTestManager" 
                th:classappend="${activeTab == 'AuraTestManager'} ? ' active' : ''"
                hx-get="/aura-test-manager" 
                hx-target="#mainViewContainer" 
                hx-swap="innerHTML"
                hx-push-url="true"
                onclick="setActiveNavBtn(this)"
                title="Neodymium Aura Test Manager">
            <span class="material-symbols-outlined">play_circle</span> <span>Aura Test Manager</span>
        </button>
    </nav>

    <div class="run-context-card" id="sidebarContextCard">
        <div class="context-symbolic-icon" title="Active Context: US Nightly Regression">
            <span class="material-symbols-outlined">science</span>
        </div>
        <div class="context-full-details">
            <div class="status-indicator">
                <div class="pulse-dot"></div>
                <span>Active Run Context</span>
            </div>
            <div style="font-weight: 700; color: var(--text-main); margin-top: 0.2rem;">US Nightly Regression</div>
            <div style="font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between;">
                <span>Run #1049</span>
                <span class="tag-chip">STG</span>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
