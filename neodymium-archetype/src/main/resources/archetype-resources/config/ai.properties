# =========================================================================================
# Neodymium AI - Configuration (ai.properties)
# =========================================================================================
# This file provides test and framework configuration specific to AI agent execution.
# =========================================================================================

# =========================================================================================
# LLM Provider Configuration
# =========================================================================================
neodymium.ai.provider = gemini
neodymium.ai.model = gemini-3.8-flash

# API Key: Recommended via environment variable GEMINI_API_KEY or JVM arg -Dneodymium.ai.apiKey=...
# neodymium.ai.apiKey = ${GEMINI_API_KEY}

# LLM Timeout in seconds (default: 180)
# neodymium.ai.timeoutSeconds = 180

# LLM Temperature (default: 0.0)
# neodymium.ai.temperature = 0.0

# LLM Network Retry Configuration (transient API error retry handling)
neodymium.ai.llm.maxRetries = 3
neodymium.ai.llm.initialRetryDelayMs = 100

# Provider Class Mappings
neodymium.ai.provider.gemini.class = org.neodymium.ai.client.GeminiLlmProvider

# =========================================================================================
# AI Execution Mode
# =========================================================================================
# Execution mode strategy for AI tests (see org.neodymium.ai.config.ExecutionMode):
# - REPLAY_WITH_HEALING (default): Replays recorded locators and triggers AI self-healing on failure.
# - REPLAY_STRICT: Pure deterministic replay with zero LLM calls; fails immediately on drift.
# - AUTO: Replays if a recording exists, otherwise executes with LLM and records.
# - FORCE_RECORDING: Ignores existing recordings, re-executes with LLM, and overwrites recordings.
# - LLM_RECORDING: Executes with LLM and records new steps.
# - LLM_ONLY: Autonomous step-by-step LLM execution without reading or writing recordings.
# - LINTER_ONLY: Validates playbook syntax and structure without launching a browser.
neodymium.ai.executionMode = REPLAY_WITH_HEALING

# =========================================================================================
# Playbook Pre-flight Linter Configuration
# =========================================================================================
# Upfront Playbook Pre-flight Linter (validates entire playbook before execution starts)
neodymium.ai.linter.enabled = true
