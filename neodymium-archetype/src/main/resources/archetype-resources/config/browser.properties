# Global browser profile properties
browserprofile.global.headless = false
browserprofile.global.acceptInsecureCertificates = true

# Default Chrome profile
browserprofile.Chrome_1500x1000.name = Chrome 1500x1000
browserprofile.Chrome_1500x1000.browser = chrome
browserprofile.Chrome_1500x1000.browserResolution = 1500x1000
browserprofile.Chrome_1500x1000.arguments = --ignore-certificate-errors

# Default Firefox profile
browserprofile.Firefox_1500x1000.name = Firefox 1500x1000
browserprofile.Firefox_1500x1000.browser = firefox
browserprofile.Firefox_1500x1000.browserResolution = 1500x1000
