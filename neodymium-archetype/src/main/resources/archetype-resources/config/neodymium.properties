# This file contains properties that will be read by Neodymium to alter properties of test execution
# All duration and timeout values are expected to be expressed in milliseconds

#############################
# Site properties
#############################
# The default URL of the web site to test
neodymium.url = https://posters.xceptance.io:8443/

#############################
# Selenide properties
#############################
# How long Selenide waits to match a condition
neodymium.selenide.timeout = 5000

# Input field values set via JavaScript
neodymium.selenide.fastSetValue = false

# Clicks executed via JavaScript
neodymium.selenide.clickViaJs = false

#############################
# Screenshot capture behavior
#############################
# Options: ALWAYS, ON_FAILURE, NEVER
neodymium.screenshot = ON_FAILURE

#############################
# Debugging properties
#############################
# Highlight elements selected by Selenide
neodymium.debugUtils.highlight = true

# Duration in milliseconds for element highlighting
neodymium.debugUtils.highlight.duration = 200
