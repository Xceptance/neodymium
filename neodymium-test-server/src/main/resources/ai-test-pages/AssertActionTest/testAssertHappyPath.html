<!DOCTYPE html>
<html>
<head>

</head>
<body>
    <h1>Assert Action Test</h1>
    
    <div id="welcome-message">Welcome to our web store!</div>
    <button id="visible-btn">Clickable Button</button>
    <button id="hidden-btn" style="display:none;">Secret Button</button>
    <input id="username" value="JohnDoe" placeholder="Enter username">

    <input id="enabled-input" value="active">
    <select id="role-select"><option id="opt-user" selected>User</option><option id="opt-admin">Admin</option></select>
    <input id="readonly-input" readonly value="FixedData">
    <div id="total-price" data-ai="xcuunj33">Total Amount: CAD $ 120.00</div>
    <span id="price-usd">$ 45.00</span>
    <span id="price-compact">$100</span>
    <div id="price-eur">50 €</div>
</body>
</html>
