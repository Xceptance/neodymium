<div class="plp-container">
    <!-- Sidebar Refinements -->
    <aside class="plp-sidebar">
        <h3 class="font-serif text-lg mb-6 border-b border-sand-200 pb-3 font-semibold text-neutral-900">${lang_refinements}</h3>
        
        <!-- Category refinement filters -->
        <div class="mb-2">
            <h4 class="text-[11px] uppercase tracking-widest text-neutral-400 mb-3 font-semibold">${lang_categories}</h4>
            <ul class="list-none flex flex-col gap-2.5 text-sm">
                <li><a href="plp.html" style="color: ${all_active_color}; font-weight: ${all_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_all}</a></li>
                <li><a href="c/tops.html" style="color: ${tops_active_color}; font-weight: ${tops_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_tops}</a></li>
                <li><a href="c/bottoms.html" style="color: ${bottoms_active_color}; font-weight: ${bottoms_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_bottoms}</a></li>
                <li><a href="c/outerwear.html" style="color: ${outerwear_active_color}; font-weight: ${outerwear_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_outerwear}</a></li>
                <li><a href="c/footwear.html" style="color: ${footwear_active_color}; font-weight: ${footwear_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_footwear}</a></li>
                <li><a href="c/accessories.html" style="color: ${accessories_active_color}; font-weight: ${accessories_active_weight};" class="hover:text-terracotta-600 transition-colors">${lang_accessories}</a></li>
            </ul>
        </div>

        <form id="refinement-form" hx-get="${filter_url}" hx-target="#plp-product-grid" hx-trigger="change" hx-include="#sort-select" class="mt-6">
            <!-- Color Refinement -->
            <div class="mb-6 border-t border-sand-200 pt-4">
                <h4 class="text-[11px] uppercase tracking-widest text-neutral-400 mb-3 font-semibold">Color</h4>
                <ul class="list-none flex flex-col gap-2 text-xs text-neutral-700">
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="off-white" ${color_off_white_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Off-White</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="charcoal" ${color_charcoal_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Charcoal</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="olive" ${color_olive_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Olive</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="sand" ${color_sand_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Sand</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="navy" ${color_navy_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Navy</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="taupe" ${color_taupe_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Taupe</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="sage" ${color_sage_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Sage</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="color" value="terracotta" ${color_terracotta_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> Terracotta</label></li>
                </ul>
            </div>

            <!-- Price Refinement -->
            <div class="mb-6 border-t border-sand-200 pt-4">
                <h4 class="text-[11px] uppercase tracking-widest text-neutral-400 mb-3 font-semibold">${lang_price}</h4>
                <ul class="list-none flex flex-col gap-2 text-xs text-neutral-700">
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="price" value="0-50" ${price_0_50_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> ${lang_under50}</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="price" value="50-100" ${price_50_100_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> ${lang_range50to100}</label></li>
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="price" value="100-200" ${price_100_200_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> ${lang_over100}</label></li>
                </ul>
            </div>

            <!-- Sale Refinement -->
            <div class="mb-6 border-t border-sand-200 pt-4">
                <h4 class="text-[11px] uppercase tracking-widest text-neutral-400 mb-3 font-semibold">Offer</h4>
                <ul class="list-none flex flex-col gap-2 text-xs text-neutral-700">
                    <li><label class="flex items-center gap-2 cursor-pointer hover:text-neutral-900"><input type="checkbox" name="sale" value="true" ${sale_checked} class="rounded border-sand-200 text-terracotta-500 focus:ring-terracotta-500"> On Sale</label></li>
                </ul>
            </div>
        </form>
    </aside>

    <!-- Product Grid Listing -->
    <section class="plp-main">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h2 class="font-serif text-2xl md:text-3xl font-semibold m-0 text-neutral-900">${plp_heading}</h2>
            <div class="flex items-center gap-5">
                <span class="text-xs text-neutral-500 font-sans" id="product-count-display">${total_products_count} ${lang_products}</span>
                <!-- Sorting filter (HTMX dynamic swap in upper right) -->
                <div class="flex items-center gap-2">
                    <label for="sort-select" class="text-xs text-neutral-500 whitespace-nowrap">${lang_sort}:</label>
                    <select name="sort" id="sort-select" class="px-4 py-2 border border-sand-200 rounded-lg bg-white text-xs outline-none cursor-pointer text-neutral-800 focus:border-terracotta-500"
                            hx-get="${filter_url}" hx-target="#plp-product-grid" hx-include="#refinement-form, #sort-select">
                        <option value="default" ${sort_default_selected}>${lang_sortDefault}</option>
                        <option value="price-asc" ${sort_asc_selected}>${lang_priceLowHigh}</option>
                        <option value="price-desc" ${sort_desc_selected}>${lang_priceHighLow}</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div id="plp-product-grid" class="products-grid">
            ${plp_products}
        </div>
    </section>
</div>
