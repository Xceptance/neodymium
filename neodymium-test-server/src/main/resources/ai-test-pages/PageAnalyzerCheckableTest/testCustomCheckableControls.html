<!DOCTYPE html>
<html>
<head>
    <title>Custom Checkable Controls Test</title>
    <style>
        .custom-radio {
            cursor: pointer;
            border: 1px solid #ccc;
            padding: 5px;
        }
        .custom-radio.checked {
            border-color: blue;
        }
    </style>
</head>
<body>
    <!-- Custom radio controls -->
    <div id="custom-group">
        <div class="custom-radio checked" id="option-dhl" data-checked="" role="radio">
            DHL Delivery
        </div>
        <div class="custom-radio" id="option-ups" role="radio">
            UPS Express
        </div>
    </div>
</body>
</html>
