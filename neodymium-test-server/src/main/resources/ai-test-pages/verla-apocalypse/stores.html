<section style="max-width: 800px; margin: 0 auto; padding: 20px 0;">
    <h1 style="font-family: var(--apoc-font-serif); font-size: 36px; font-weight: 700; color: var(--apoc-gold); margin-bottom: 20px;">Private Salons &amp; Flagships</h1>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px;">
        <div style="background:var(--apoc-bg-surface); border:1px solid var(--apoc-border); border-radius:8px; padding:20px;">
            <h3 style="color:#fff; font-size:16px;">Place Vendôme, Paris</h3>
            <p style="color:var(--apoc-text-secondary); font-size:13px; margin-top:6px;">18 Place Vendôme, 75001 Paris</p>
        </div>
        <div style="background:var(--apoc-bg-surface); border:1px solid var(--apoc-border); border-radius:8px; padding:20px;">
            <h3 style="color:#fff; font-size:16px;">Madison Avenue, New York</h3>
            <p style="color:var(--apoc-text-secondary); font-size:13px; margin-top:6px;">740 Madison Ave, New York, NY 10065</p>
        </div>
        <div style="background:var(--apoc-bg-surface); border:1px solid var(--apoc-border); border-radius:8px; padding:20px;">
            <h3 style="color:#fff; font-size:16px;">Ginza, Tokyo</h3>
            <p style="color:var(--apoc-text-secondary); font-size:13px; margin-top:6px;">6-10-1 Ginza, Chuo-ku, Tokyo 104-0061</p>
        </div>
    </div>
</section>
