<div style="display: flex; gap: 32px; align-items: flex-start;">
    <!-- Refinement Sidebar -->
    <aside style="width: 260px; flex-shrink: 0; background: var(--apoc-bg-surface); border: 1px solid var(--apoc-border); border-radius: 8px; padding: 24px; position: sticky; top: 100px;">
        <h3 style="font-family: var(--apoc-font-serif); font-size: 18px; color: var(--apoc-gold); margin-bottom: 20px; border-bottom: 1px solid var(--apoc-border); padding-bottom: 8px;">
            Refine Catalog
        </h3>

        <!-- Filter Form -->
        <form id="apoc-filter-form" action="plp.html" method="GET">
            <input type="hidden" name="category" value="${current_category}">
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--apoc-text-secondary); margin-bottom: 8px;">Sort by</label>
                <select name="sort" style="width: 100%; background: var(--apoc-bg-elevated); border: 1px solid var(--apoc-border); border-radius: 4px; color: #fff; padding: 8px 10px; font-size: 12px;" onchange="this.form.submit()">
                    <option value="featured">Vault Signature</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--apoc-text-secondary); margin-bottom: 8px;">Price Band</label>
                <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--apoc-text-secondary);">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="price" value="0-50" onchange="this.form.submit()"> Under $50
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="price" value="50-100" onchange="this.form.submit()"> $50 &mdash; $100
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="price" value="100-200" onchange="this.form.submit()"> $100 &mdash; $200
                    </label>
                </div>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--apoc-text-secondary); margin-bottom: 8px;">Privilege Offer</label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--apoc-gold); cursor: pointer;">
                    <input type="checkbox" name="sale" value="true" onchange="this.form.submit()"> Private Sale Only
                </label>
            </div>

            <button type="submit" class="apoc-btn-gold" style="width: 100%; padding: 8px; font-size: 11px;">
                Apply Filters
            </button>
        </form>
    </aside>

    <!-- Main Products Listing -->
    <div style="flex: 1; min-width: 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--apoc-border); padding-bottom: 12px;">
            <div>
                <h1 style="font-family: var(--apoc-font-serif); font-size: 28px; font-weight: 700; color: #FFFFFF;">
                    ${category_title}
                </h1>
                <p style="font-size: 13px; color: var(--apoc-text-secondary); margin-top: 4px;">
                    ${category_item_count} items curated for selective connoisseurs
                </p>
            </div>
            <div>
                <span class="ps-txt ps-txt-free-shipping" style="font-size: 12px; color: var(--apoc-gold); font-weight: 600;"></span>
            </div>
        </div>

        <div id="plp-product-grid" class="apoc-products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px;">
            ${plp_products}
        </div>
    </div>
</div>
