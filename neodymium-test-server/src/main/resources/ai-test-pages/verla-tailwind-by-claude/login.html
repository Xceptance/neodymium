<div id="login-wrapper" class="mx-auto my-5 w-full max-w-[450px] rounded-lg border border-sand-200 bg-sand-50 p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] sm:my-10 sm:p-8">
    <h2 class="mb-6 text-center font-serif text-[26px] font-semibold">${lang_login}</h2>

    <!-- Inline login error display -->
    <div class="mb-4 text-center text-xs font-semibold text-danger">${auth_error}</div>

    <form hx-post="api/auth/login" hx-target="#login-wrapper" hx-swap="outerHTML">
        <div class="mb-5">
            <label for="email" class="mb-2 block text-[13px] font-semibold uppercase tracking-[0.05em]">${lang_email}</label>
            <input type="email" id="email" name="email" class="w-full rounded-lg border border-sand-200 bg-sand-50 px-4 py-3 outline-none transition-colors focus:border-terracotta-500 focus:bg-white" placeholder="johndoe@example.com" required value="${input_email}">
            <div class="mt-1 text-xs font-medium text-danger">${err_email}</div>
        </div>

        <div class="mb-6">
            <label for="password" class="mb-2 block text-[13px] font-semibold uppercase tracking-[0.05em]">${lang_password}</label>
            <input type="password" id="password" name="password" class="w-full rounded-lg border border-sand-200 bg-sand-50 px-4 py-3 outline-none transition-colors focus:border-terracotta-500 focus:bg-white" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" required>
            <div class="mt-1 text-xs font-medium text-danger">${err_password}</div>
        </div>

        <button type="submit" class="mb-5 w-full rounded-lg bg-terracotta-500 px-5 py-3 text-[13px] font-semibold uppercase tracking-[0.05em] text-white transition-colors hover:bg-terracotta-700">
            ${lang_login}
        </button>

        <p class="text-center text-[13px] text-muted">
            ${lang_noAccount} <a href="register.html" class="font-semibold text-terracotta-500 transition-colors hover:text-terracotta-700">${lang_register}</a>
        </p>
    </form>
</div>
