<div style="margin-bottom: 20px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.05em;">
    <a href="index.html" style="color: #005699;">${lang_home}</a> &middot; 
    <a href="c/${product_category}.html" style="color: #005699;">${product_category_name}</a> &middot; 
    <span style="color: #222; font-weight: 600;">${product_name}</span>
</div>

<div class="pdp-container" style="display: flex; gap: 48px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 60px;">
    <!-- Product Media Gallery -->
    <div class="pdp-image-wrapper" style="flex: 1.2; min-width: 320px; background: #FAF9F6; border: 1px solid var(--color-border); border-radius: 8px; padding: 48px; display: flex; justify-content: center; align-items: center; position: relative;">
        ${product_badge_html}
        <svg viewBox="0 0 100 100" style="width: 100%; max-width: 300px; height: auto; color: #005699;">
            ${product_svg_content}
        </svg>
    </div>

    <!-- Product Info & Purchase Form -->
    <div class="pdp-info-wrapper" style="flex: 1; min-width: 300px;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #E80070; letter-spacing: 0.1em; margin-bottom: 8px; display: block;">${product_subcategory_name}</span>
        <h1 style="font-family: var(--font-family-serif); font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; color: #005699;">${product_name}</h1>
        
        <!-- Local Price Display -->
        <div style="font-size: 22px; font-weight: 700; color: #1A1A1A; margin-bottom: 20px;">
            ${product_price_html}
        </div>

        <p style="color: #555; line-height: 1.7; margin-bottom: 24px; border-top: 1px solid var(--color-border); padding-top: 20px; font-size: 14px;">
            ${product_desc}
        </p>

        <!-- Dynamic Stock Countdown -->
        <div style="background: #FFF3CD; color: #856404; font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 4px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
            <span>⚡ Only a few left in stock &mdash; order soon!</span>
        </div>

        <!-- Add to Bag Form -->
        <form id="pdp-add-to-cart-form" onsubmit="event.preventDefault(); window.pwaCart ? window.pwaCart.add('${product_id}', parseInt(this.quantity.value, 10)) : htmx.ajax('POST', 'api/cart/add?productId=${product_id}&quantity=' + this.quantity.value, '#cart-btn-wrapper'); openMiniCartDrawer();" style="border-top: 1px solid var(--color-border); padding-top: 20px;">
            <input type="hidden" name="productId" value="${product_id}">
            
            <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 24px; flex-wrap: wrap;">
                ${product_sizes_html}

                <div style="display: flex; gap: 10px; align-items: center;">
                    <label for="quantity" style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #555;">${lang_quantity}:</label>
                    <select name="quantity" id="quantity" style="padding: 8px 14px; border: 1px solid var(--color-border); border-radius: 4px; background: #fff; outline: none; cursor: pointer; font-size: 13px;">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; background: #005699;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 1.375c1.103 0 2.156.458 2.927 1.264a4.36 4.36 0 0 1 1.188 2.736h4.01v16.417H3.875V5.375h4.01a4.35 4.35 0 0 1 1.188-2.736A4.05 4.05 0 0 1 12 1.375M5.125 20.542h13.75V6.625H5.125zM12 2.625a2.8 2.8 0 0 0-2.023.878 3.1 3.1 0 0 0-.838 1.872h5.722a3.1 3.1 0 0 0-.838-1.872A2.8 2.8 0 0 0 12 2.625"/></svg>
                ${lang_addToCart}
            </button>
        </form>
    </div>
</div>
