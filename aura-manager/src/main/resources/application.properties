# Neodymium Aura Manager - Spring Boot Configuration
server.port=8080
spring.application.name=aura-manager

# Logging Configuration
logging.level.root=INFO
logging.level.com.xceptance.aura=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# Thymeleaf Settings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Static Asset Locations (including local mock attachments folder)
spring.web.resources.static-locations=classpath:/static/,file:./storage/attachments/

# JPA & H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/auradb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Aura Report Persistence Configuration
aura.report.storage.runs.base-dir=storage/runs
aura.report.storage.attachments.provider=local
aura.report.storage.attachments.local.base-dir=storage/attachments/
aura.report.storage.attachments.s3.bucket-name=aura-report-attachments
aura.report.storage.attachments.s3.region=us-west-2
aura.report.storage.attachments.s3.access-key=
aura.report.storage.attachments.s3.secret-key=
aura.report.storage.attachments.s3.endpoint-url=

# Neodymium Aura MCP Server Configuration
neodymium.aura.mcp.enabled=true
neodymium.aura.mcp.auth.token=

# Spring AI MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=neodymium-aura-manager
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.protocol=STATELESS

