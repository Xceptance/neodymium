<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Test Base Variation History Drawer Side Panel Fragment -->
<div th:fragment="variationHistoryPanel" class="side-panel-drawer" id="variationHistoryDrawer">
    <div class="side-panel-resizer" id="variationHistoryResizer"></div>
    
    <!-- Drawer Header -->
    <div class="p-3 border-bottom bg-light d-flex align-items-start justify-content-between">
        <div>
            <div class="h6 mb-1 fw-bold font-size-lg" id="tbHistSidePanelTitle"></div>
            <div class="font-size-sm text-muted" id="tbHistSidePanelSubtitle"></div>
        </div>
        <button type="button" class="btn-close js-close-side-panel" aria-label="Close"></button>
    </div>

    <!-- Drawer Body -->
    <div class="p-3 overflow-auto flex-grow-1 d-flex flex-column gap-3">
        <!-- Execution History Across All Batches Box -->
        <div class="card card-custom p-3">
            <div class="card-header bg-transparent fw-bold font-size-lg border-0 px-0 d-flex align-items-center justify-content-between">
                <span><span class="material-symbols-outlined text-primary me-2">history</span> Execution History Across All Batches</span>
            </div>

            <!-- History Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom mb-0 history-table" style="table-layout: fixed; width: 100%;">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Run ID</th>
                            <th style="width: 16%;">Batch Name</th>
                            <th style="width: 12%;">Engine</th>
                            <th style="width: 20%;">Timestamp</th>
                            <th style="width: 22%;">Status / Bugs</th>
                        </tr>
                    </thead>
                    <tbody id="tbVariationHistoryTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
