<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Top Header Fragment -->
<header th:fragment="header" id="appHeader">
    <!-- Test Manager Section Header Content -->
    <th:block th:if="${activeTab == 'AuraTestManager'}">
        <div class="header-title-area">
            <div class="header-title" id="pageTitle">
                <span class="material-symbols-outlined text-accent">auto_awesome</span>
                <span th:text="${pageTitle ?: 'Neodymium Aura Manager Dashboard'}">Neodymium Aura Manager Dashboard</span>
            </div>
        </div>

        <div class="header-actions d-flex align-items-center gap-2">
            <button class="btn-edit btn-secondary" id="settingsBtn" onclick="openSettingsModal()" title="Settings" style="padding: 0.35rem 0.75rem; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                <span class="material-symbols-outlined" style="font-size: 1.1rem;">settings</span> Settings
            </button>
            <div class="d-flex align-items-center gap-1" id="themeContainer" th:fragment="themeContainer" style="background: var(--bg-main); padding: 2px; border-radius: 6px; border: 1px solid var(--border-color);">
                <button class="btn-edit" id="themeLight" onclick="changeTheme('light')" title="Light Mode" style="padding: 2px 6px; border: none; background: transparent;"><span class="material-symbols-outlined" style="font-size: 1rem;">light_mode</span></button>
                <button class="btn-edit" id="themeDark" onclick="changeTheme('dark')" title="Dark Mode" style="padding: 2px 6px; border: none; background: transparent;"><span class="material-symbols-outlined" style="font-size: 1rem;">dark_mode</span></button>
                <button class="btn-edit" id="themeSystem" onclick="changeTheme('system')" title="System Theme" style="padding: 2px 6px; border: none; background: transparent;"><span class="material-symbols-outlined" style="font-size: 1rem;">desktop_windows</span></button>
            </div>
        </div>
    </th:block>

    <!-- Report Manager Section Header Content -->
    <th:block th:unless="${activeTab == 'AuraTestManager'}">
        <div class="header-title-area">
            <div class="header-title" id="pageTitle">
                <span class="material-symbols-outlined text-accent" th:text="${activeTab == 'TestBase' ? 'database' : (activeTab == 'BatchHistory' ? 'trending_up' : (activeTab == 'RunReport' ? 'science' : 'fact_check'))}">fact_check</span>
                <span th:text="${pageTitle ?: 'Overview of Runs & Known Batches'}">Overview of Runs & Known Batches</span>
            </div>
            <div class="breadcrumb" id="headerBreadcrumb" style="display: none;">
                <span>/</span> <a href="/report" style="cursor: pointer; text-decoration: none; font-weight: 600;">Known Batches</a> <span id="breadcrumbTrail"></span>
            </div>
        </div>

        <div class="header-actions">
            <button class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" 
                    hx-post="/runs/refresh" 
                    hx-target="#mainViewContainer" 
                    hx-swap="innerHTML" 
                    title="Analyze storage report folders, generate run.json files, and refresh views">
                <span class="material-symbols-outlined">sync</span> Resync Storage
            </button>

            <button class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" 
                    hx-post="/runs/refresh" 
                    hx-target="#mainViewContainer" 
                    hx-swap="innerHTML"
                    title="Refresh reports and re-sync database">
                <span class="material-symbols-outlined">refresh</span> Refresh
            </button>
            <span id="resyncToast" style="font-size: 0.8rem; color: #22c55e; margin-left: 0.5rem; font-weight: 500;"></span>
        </div>
    </th:block>
</header>

</body>
</html>
