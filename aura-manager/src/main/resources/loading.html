<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting to Aura Manager...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e0e0e0;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Starting Aura Manager...</h2>
  <p id="status">Waiting for connection on localhost:8080...</p>

  <script>
    const TARGET_URL = "http://localhost:8080";

    async function checkServer() {
      try {
        // mode: 'no-cors' allows detecting server readiness even without CORS headers configured
        await fetch(TARGET_URL, { mode: 'no-cors' });
        document.getElementById('status').innerText = "Connected! Redirecting...";
        window.location.href = TARGET_URL;
      } catch (err) {
        // Server is not up yet; retry in 1 second
        setTimeout(checkServer, 1000);
      }
    }

    checkServer();
  </script>
</body>
</html>
