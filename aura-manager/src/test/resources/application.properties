# Neodymium Aura Manager - Isolated Test Configuration
# Uses an in-memory database to prevent disk locking and H2 MVStore file compaction assertion errors

# In-Memory H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:auradb_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Aura Report Persistence Configuration
aura.report.storage.runs.base-dir=storage/runs
aura.report.storage.attachments.provider=local
aura.report.storage.attachments.local.base-dir=storage/attachments/

# Neodymium Aura MCP Server Configuration
neodymium.aura.mcp.enabled=true
neodymium.aura.mcp.auth.token=
neodymium.aura.mcp.heartbeat-interval-seconds=45
neodymium.aura.mcp.session-timeout-seconds=120
spring.ai.mcp.server.name=neodymium-aura-manager
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
