# =============================================================================
# VÉRLA Demo Store - Central Configuration & Runtime Latency Properties
# =============================================================================

# Master toggle for simulated latency (true | false)
verla.latency.enabled = true

# Global latency scaling factor:
#   1.0 = standard real-world runtime
#   2.0 = double latency (high latency / slow network simulation)
#   0.2 = fast execution (20% of base latency)
#   0.0 = instant execution (all delays bypassed)
verla.latency.scale = 1.0

# -----------------------------------------------------------------------------
# 1. Add to Cart & Cart Operations (ms)
# -----------------------------------------------------------------------------
# Adding a product variant to shopping cart (PDP form or PLP quick add)
verla.latency.cart.add.min = 150
verla.latency.cart.add.max = 300

# Updating product quantity in cart
verla.latency.cart.update.min = 100
verla.latency.cart.update.max = 250

# Removing an item from cart
verla.latency.cart.remove.min = 100
verla.latency.cart.remove.max = 200

# Applying or validating coupon discount code
verla.latency.cart.coupon.min = 120
verla.latency.cart.coupon.max = 250

# Mini-cart dropdown dynamic content retrieval
verla.latency.cart.dropdown.min = 80
verla.latency.cart.dropdown.max = 180

# -----------------------------------------------------------------------------
# 2. Search & Catalog Operations (ms)
# -----------------------------------------------------------------------------
# Live search autocomplete suggestion query (search-as-you-type)
verla.latency.search.suggest.min = 100
verla.latency.search.suggest.max = 220

# Full search query results page (plp.html?q=...)
verla.latency.search.query.min = 200
verla.latency.search.query.max = 400

# Dynamic product filtering (color, price, sort, pagination via HTMX)
verla.latency.products.filter.min = 180
verla.latency.products.filter.max = 350

# -----------------------------------------------------------------------------
# 3. Checkout & Payment Simulation (ms)
# -----------------------------------------------------------------------------
# Payment gateway authorization, fraud scoring, order creation, and confirmation
verla.latency.checkout.purchase.min = 500
verla.latency.checkout.purchase.max = 900

# -----------------------------------------------------------------------------
# 4. Order Tracking & Authentication (ms)
# -----------------------------------------------------------------------------
# Guest order lookup and tracking
verla.latency.order.lookup.min = 120
verla.latency.order.lookup.max = 250

# Customer login session creation
verla.latency.auth.login.min = 150
verla.latency.auth.login.max = 300

# Customer account registration
verla.latency.auth.register.min = 200
verla.latency.auth.register.max = 400
