# =============================================================================
# VÉRLA Demo Store - Central Configuration & Runtime Latency Properties
# =============================================================================

# Master toggle for simulated latency (true | false)
verla.latency.enabled = true

# Global latency scaling factor:
#   1.0 = standard real-world runtime
#   2.0 = double latency (high latency / slow network simulation)
#   0.2 = fast execution (20% of base latency)
#   0.0 = instant execution (all delays bypassed)
verla.latency.scale = 1.0

# -----------------------------------------------------------------------------
# 1. Add to Cart & Cart Operations (ms)
# -----------------------------------------------------------------------------
# Adding a product variant to shopping cart (PDP form or PLP quick add)
verla.latency.cart.add.min = 150
verla.latency.cart.add.max = 300

# Updating product quantity in cart
verla.latency.cart.update.min = 100
verla.latency.cart.update.max = 250

# Removing an item from cart
verla.latency.cart.remove.min = 100
verla.latency.cart.remove.max = 200

# Applying or validating coupon discount code
verla.latency.cart.coupon.min = 120
verla.latency.cart.coupon.max = 250

# Mini-cart dropdown dynamic content retrieval
verla.latency.cart.dropdown.min = 80
verla.latency.cart.dropdown.max = 180

# -----------------------------------------------------------------------------
# 2. Search & Catalog Operations (ms)
# -----------------------------------------------------------------------------
# Live search autocomplete suggestion query (search-as-you-type)
verla.latency.search.suggest.min = 100
verla.latency.search.suggest.max = 220

# Full search query results page (plp.html?q=...)
verla.latency.search.query.min = 200
verla.latency.search.query.max = 400

# Dynamic product filtering (color, price, sort, pagination via HTMX)
verla.latency.products.filter.min = 180
verla.latency.products.filter.max = 350

# -----------------------------------------------------------------------------
# 3. Checkout & Payment Simulation (ms)
# -----------------------------------------------------------------------------
# Payment gateway authorization, fraud scoring, order creation, and confirmation
verla.latency.checkout.purchase.min = 500
verla.latency.checkout.purchase.max = 900

# -----------------------------------------------------------------------------
# 4. Order Tracking & Authentication (ms)
# -----------------------------------------------------------------------------
# Guest order lookup and tracking
verla.latency.order.lookup.min = 120
verla.latency.order.lookup.max = 250

# Customer login session creation
verla.latency.auth.login.min = 150
verla.latency.auth.login.max = 300

# Customer account registration
verla.latency.auth.register.min = 200
verla.latency.auth.register.max = 400

# =============================================================================
# 5. Headless PWA SUT (/verla-headless/) - Composable Storefront Simulation
# =============================================================================
# This variant reproduces the runtime quality profile of a headless commerce
# SPA (client-side rendering, API request fan-out, session bootstrap race).
# The structural anti-patterns are always present; these properties control
# their magnitude so CI runs stay affordable while demos can be brutal.
#
# Presets:
#   mid  (default) ~300 KB page, ~2-3 s to interactive - suitable for CI
#   full           ~1.8 MB page, ~10 s to interactive  - realistic worst case
#   lean           minimal payload, patterns intact    - fastest feedback

# Master toggle. When false the variant renders server-side like verla-normal
# (useful to A/B the cost of client-side rendering).
verla.headless.enabled = true

# -----------------------------------------------------------------------------
# 5.1 Payload Weight
# -----------------------------------------------------------------------------
# Size of the inlined hydration state blob (<script id="__PRELOADED_STATE__">).
# Real-world reference: 907 KB. Contains real product data plus filler padding.
verla.headless.hydration.kb = 120

# Size of the inlined SVG icon sprite rendered into every page.
# Real-world reference: 621 KB across 92 blocks.
verla.headless.sprite.kb = 40

# Weight of one product image rendition (KB at the published 960px width). Only the
# large rendition exists, so every tile pays this regardless of its display size.
# Real-world reference: ~27 KB per grid image, 121 images per page.
verla.headless.image.kb = 24

# Number of separate <style> tags injected (CSS-in-JS per-component emission).
# Real-world reference: 176 tags / 120 KB.
verla.headless.styletags = 60

# -----------------------------------------------------------------------------
# 5.2 Client-Side Rendering Fan-Out
# -----------------------------------------------------------------------------
# Product tiles are server-rendered as skeletons only; each tile fetches its own
# product document. This is the N+1 request pattern (28 tiles = 28 requests).
# 0 disables fan-out and renders tiles server-side.
verla.headless.tile.fanout = 12

# Per-tile product document latency (ms). Jitter across tiles is what makes the
# grid settle progressively rather than all at once.
verla.headless.tile.latency.min = 120
verla.headless.tile.latency.max = 480

# Delay before the SPA bundle "hydrates" and attaches event listeners (ms).
# Until this elapses, clicks land on inert markup.
verla.headless.boot.min = 600
verla.headless.boot.max = 1200

# -----------------------------------------------------------------------------
# 5.3 Session Bootstrap Race
# -----------------------------------------------------------------------------
# Reproduces the observed double-token handshake: two OAuth token POSTs race,
# the basket/wishlist triple fires once with a stale customer id (HTTP 400) and
# again with the settled id (HTTP 200). Cart mutations issued before the session
# settles are rejected the same way the real storefront rejects them.
verla.headless.session.race.enabled = true

# Time window in which the session settles (ms). Randomized per session, so
# tests must wait on an actual readiness signal rather than a fixed sleep.
verla.headless.session.race.min = 400
verla.headless.session.race.max = 1600

# OAuth token endpoint latency (ms)
verla.headless.session.token.min = 80
verla.headless.session.token.max = 260

# -----------------------------------------------------------------------------
# 5.4 CMS Slot Hydration
# -----------------------------------------------------------------------------
# Footer link list, legal text and strip banner are each fetched as a separate
# content document after first paint, causing late cumulative layout shift.
verla.headless.cms.slot.latency.min = 250
verla.headless.cms.slot.latency.max = 900
