# =========================================================================================
# AI Configuration Properties (ai.properties)
# =========================================================================================
# This file provides test and framework configuration specific to the AI agent execution.
# =========================================================================================
# AI Test Prompt Generation
# =========================================================================================

# Enables the AI Test Prompt generation feature. Must be explicitly set to true 
# to run @NeodymiumTestGenerator annotated exploratory AI runs.
neodymium.ai.generate = false


neodymium.ai.apiKey = ${GEMINI_API_KEY}
neodymium.ai.report.disk.directory=aura-report-manager/storage/runs
neodymium.ai.model = gemini-3.5-flash-lite

# =========================================================================================
# Playbook Recording Output Directory
# =========================================================================================
# Custom directory path where recorded companion playbook JSON files are saved.
# When omitted (default), companion JSON recordings are stored alongside the source YAML playbook
# in its parent directory (e.g. src/test/resources/playbooks/...).
# Set to 'target/playbooks/integration' or 'target/playbooks' to redirect generated
# companion recordings to build output target directories and keep source trees clean.
#neodymium.ai.playbook.recordingDirectory = target/playbooks/integration

# =========================================================================================
# Replay Execution & Timing Configuration
# =========================================================================================
# Multiplier applied to recorded delays (delayMs) during companion playbook replay.
# - 0.0 (default): Replay delays are OFF. Execution runs instantly with 0 ms artificial wait,
#                  relying on dynamic WebDriver/Selenide polling (fastest for CI/CD builds).
# - 1.0: Real-time pacing. Replays at 100% of recorded human/recording speeds.
# - 0.5: 2x speed replay. Paces at 50% of recorded timing.
#neodymium.ai.replay.delayScale = 0.0

# =========================================================================================
# Semantic Outcome Verification Phase
# =========================================================================================
# Controls whether the AI pipeline performs an outcome verification step after action execution.
# Set to false to disable post-action VerificationPrompt LLM calls.
neodymium.ai.semanticVerification.enabled = false
# Controls whether semantic outcome verification failures abort test execution.
# Set to false to log warnings and display badges in test reports without failing the test (default: false).
neodymium.ai.semanticVerification.failOnError = false

# =========================================================================================
# Visual Assertion & Stability Settling Configuration
# =========================================================================================
# Minimum Mean Structural Similarity Index (SSIM) required for visual assertion matching.
neodymium.ai.ssim.minScore = 0.99

# Polling interval in milliseconds between consecutive frame captures during visual stability detection (minimum: 1000ms).
neodymium.ai.visual.stabilityIntervalMs = 1000

# Maximum number of attempts allowed for temporal inter-frame visual stability settling.
neodymium.ai.visual.stabilityMaxAttempts = 5

# Minimum inter-frame SSIM threshold required to consider the SUT visually quiescent/settled.
neodymium.ai.visual.stabilityThreshold = 0.999

# =========================================================================================
# AI Semantic Assertion Configuration (LlmMode.ASSERT)
# =========================================================================================
# Dedicated configuration settings for secondary LLM evaluation/assertions (LlmAssert).
# If not specified, the standard properties (API key, model, timeout) are used as fallback.

# API key to use for assertion LLM calls.
#neodymium.ai.assertion.apiKey =

# Model name to use for assertion LLM calls.
# neodymium.ai.assertion.model = gemini-3.5-flash-lie

# Temperature to use for assertion LLM calls.
#neodymium.ai.assertion.temperature = 0.0

# Timeout in seconds for assertion LLM calls.
#neodymium.ai.assertion.timeoutSeconds = 180

# =========================================================================================
# Secure Java Method Reflector Configuration
# =========================================================================================
# Comma-separated list of fully qualified class names that the JAVA_METHOD action
# plugin should scan for static utility methods when a method is not found on the test
# instance itself. All methods must be public static and annotated with @AiMethod.
neodymium.ai.agent.methods.classes = com.xceptance.neodymium.junit5.tests.auramanager.end2end.AuraManagerTestHelper

# Comma-separated list of package names to scan for public static utility classes
# containing methods annotated with @AiMethod.
neodymium.ai.agent.methods.packages = 

# =========================================================================================
# Playbook Directory Configuration
# =========================================================================================
# Specifies the global directory path where recorded AI playbooks are loaded from and saved to.
# Default is src/test/resources/ai-playbooks/
playbook.directory.global = src/test/resources/ai-playbooks/

# =========================================================================================
# LLM Provider Class Mappings
# =========================================================================================
neodymium.ai.provider.gemini.class = org.neodymium.ai.client.GeminiLlmProvider
neodymium.ai.provider.mistral.class = org.neodymium.ai.client.MistralLlmProvider
neodymium.ai.provider.vertexaillama.class = org.neodymium.ai.client.VertexAiLlamaProvider

# =========================================================================================
# Volatile Element ID Detection Rules (Option B Indexed Rules)
# =========================================================================================
# Rules to detect and strip auto-generated dynamic framework IDs from DOM dumps
# Rule 1: React 18 internal component ID hook (:r0:, :r1:, etc.)
neodymium.ai.dom.volatileIdPatterns.1 = ^:[a-zA-Z0-9_-]+:

# Rule 2: Modern UI Component Framework Prefixes (Radix, React-Aria, MUI, AntD, ElementPlus, PrimeVue, Angular Material/CDK, Ember, Svelte)
neodymium.ai.dom.volatileIdPatterns.2 = ^(radix|react-aria|mui|rc-|antd-|el-id|pv_id|cdk-|mat-|ember|svelte)[-_]?.*

# Rule 3: Vue and Vuetify Dynamic Component Hashes (v-btn-1234, v-node-1234, v-inner-1234, react-div-1234, etc.)
neodymium.ai.dom.volatileIdPatterns.3 = ^(v-btn|v-node|v-inner|v-input|v-select|v-card|v-dialog|v-list|v-sheet|v-container|v-row|v-col|react-div|react-hydrated|announcement-bar)-.*

# Rule 4: Standard RFC 4122 UUIDs & GUIDs (36-character hex strings)
neodymium.ai.dom.volatileIdPatterns.4 = ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

# Rule 5: Numeric Hash Suffixes (4 or more trailing digits)
neodymium.ai.dom.volatileIdPatterns.5 = .*[_-]\\d{4,}$

# =========================================================================================
# Automatic Locator Improver Configuration
# =========================================================================================
# Controls whether Neodymium AI automatically evaluates and upgrades recorded target locators.
# Set to false to disable locator improvement.
neodymium.ai.locatorImprover.enabled = false


# Controls candidate locators output formatting mode in prompts and logs. Valid options: DETAILED (default) or COMPACT.
neodymium.ai.action.locators.format = DETAILED

# =========================================================================================
# LLM Quality Judge ("Second Opinion") Configuration
# =========================================================================================
# Controls whether the independent LLM Quality Judge evaluation step (QualityJudgeStep) is enabled.
# Set to false to disable second-opinion evaluation calls. Default: false.
neodymium.ai.judge.enabled = false

# Execution mode for LLM Quality Judge. Valid options: DISCUSSION (default), ON_AMBIGUITY, ALWAYS, ON_FAIL.
# - DISCUSSION: Interactive multi-turn deliberation with live browser probing.
# - ON_AMBIGUITY: Only evaluates when top candidate locators have close confidence scores (diff < 0.15).
# - ALWAYS: Evaluates every single LLM action call.
# - ON_FAIL: Evaluates only during self-healing retries after action execution fails.
neodymium.ai.judge.mode = DISCUSSION

# Maximum interactive deliberation turns per action before taking the last proposal (default: 3)
neodymium.ai.judge.discussion.maxTurns = 3

# Maximum matching element summaries returned per candidate probe (default: 3)
neodymium.ai.judge.discussion.probeDepth = 3

# Fast-path auto-approval on unique high-confidence matches (default: true)
neodymium.ai.judge.discussion.fastPath = true

# =========================================================================================
# Visual Root Cause Analysis (Visual RCA) Configuration
# =========================================================================================
# Controls whether Visual Root Cause Analysis is automatically triggered on conclusive test execution
# failures to diagnose visual page errors via visual screenshots. Default: true.
neodymium.ai.visualRca.enabled = true

# =========================================================================================
# LLM Wire Communication Logging
# =========================================================================================
# Controls whether native raw LLM communication (HTTP request and response payloads) is logged
# to a separate log file (target/neodymium-ai-communication.log). Disabled by default.
# Can also be toggled via log4j2.properties by changing logger.org_neodymium_ai_communication.level to 'info'.
neodymium.ai.communicationLog.enabled = false