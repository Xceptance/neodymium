steps: |
  Open ${verla.url}/verla-perfect/index.html
  Open country region selection modal.
  Select country '${countryName}'.
  Verify country flag for '${countryName}' is displayed.

  Locate the first product card and click 'Add to Cart'
  Click size button 'L'
  Verify mini cart quantity is 1.
  Navigate to cart page.
  Click checkout button.

  Verify checkout page headline.
  Select '${countryName}' in checkout shipping country dropdown.
  Enter first name '${firstName}', last name '${lastName}', and email '${email}'.
  Enter street address '${street}', city '${city}', state '${state}', and postcode '${postcode}'.
  If there is a 'prefecture' input field, enter '${prefecture}'.

  Enter card number '4111 1111 1111 1111', expiry '12/29', and CVV '111'.
  Click purchase submit button.
  Wait for confirmation text "${expectedSuccessText}" to appear.
  An order number matching regex '${expectedOrderPattern}' is displayed.
  The total amount is displayed in currency '${currencySymbol}'.
  The postal code '${postcode}' and confirmation message "${expectedSuccessText}" are displayed.
  A green checkmark icon is visible on screen (visual: full).

