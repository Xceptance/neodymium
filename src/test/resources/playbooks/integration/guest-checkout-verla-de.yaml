steps: |
  # we test the US site, so elements are in English, but we use German here as language to
  # drive the test
  Öffne ${verla.url}/verla-${quality}/index.html
  Überprüfe, dass Vereinigte Staaten als Land ausgewählt ist.
  Finde die erste Produktkarte und klicke auf die Schaltfläche 'Add to Cart'
  # Bad interface design has no size
  Wenn diese Zeichenkette '${quality}' nicht gleich 'bad' ist, klicke auf die Größen-Schaltfläche 'L'
  Die Anzahl im Mini-Warenkorb ist jetzt 1.
  Gehe über den Mini-Warenkorb zum Warenkorb.
  Klicke auf 'Checkout'

  Die Überschrift lautet nun 'Checkout'
  Es gibt Dateneingabeformulare auf der linken Seite und einen Bestellübersichtsblock auf der rechten Seite (visual).
  Wähle 'United States' als Land aus.
  Gib 'Mario' als Vorname, 'Meier' als Nachname und die E-Mail-Adresse 'foo@varmail.net' ein.
  Gib '123 Main St' als Straße, 'Manchester' als Stadt und '12345' als Postleitzahl ein.
  Gib das Bundesland 'MA' ein.
  Kartennummer ist '4111 1111 1111 1111', Ablaufdatum '12/29' und CVV ist '111'.
  Klicke auf 'Kaufen'.
  Warte bis der Text "Thank you for your purchase!" erscheint.
  Scrolle so weit wie möglich nach oben, um die vollständige Bestellbestätigung anzuzeigen.
  Eine Bestellnummer im Format 'V-[0-9]+-US' wird angezeigt.
  Der Gesamtbetrag ist angegeben und in USD.
  Die Postleitzahl lautet '12345'.
  Der Text "Thank you for your purchase!" wird angezeigt.
  Es befindet sich ein grünes Häkchen in der Mitte des Bildschirms (visual).

