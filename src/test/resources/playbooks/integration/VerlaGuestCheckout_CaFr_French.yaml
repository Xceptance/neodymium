  Numéro de carte '4111 1111 1111 1111', date d'expiration '12/29' et CVV '111'.
  Cliquer sur 'Acheter'.
  Attendre que le texte "Merci pour votre achat !" apparaisse.
  Un numéro de commande au format 'V-[0-9]+-CA_FR' est affiché, le montant total est en CAD $, le code postal est 'H2X 3K4' et le texte "Merci pour votre achat !" est affiché.
