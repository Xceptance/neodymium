<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Test Base Fragment -->
<div th:fragment="testBase" class="d-flex flex-column gap-4" id="pageTestBase">
    <!-- Header Banner -->
    <div class="card card-custom p-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div>
                <div class="h5 mb-1 font-size-lg fw-bold d-flex align-items-center gap-2">
                    <i class="fa-solid fa-database text-primary"></i>
                    <span>Comprehensive Test Base Repository</span>
                </div>
                <div class="font-size-sm text-muted">Repository of all test classes and dataset/browser execution variations across all known batches.</div>
            </div>
        </div>
    </div>

    <!-- Test Base Area Sub-Tabs & Filters -->
    <div class="card card-custom p-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <div class="nav nav-tabs font-size-sm border-0" id="tbAreaSubTabs">
                <button class="nav-link active fw-bold" type="button">@Checkout Checkout & Payments</button>
                <button class="nav-link fw-bold" type="button">@Authentication Accounts</button>
            </div>

            <!-- Filters -->
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle js-multiselect-toggle" type="button" data-menu-id="tbBatchMultiselectMenu">
                        <span>Batches: <strong class="js-selected-text">All Selected</strong></span>
                    </button>
                    <div class="dropdown-menu multiselect-menu p-2" id="tbBatchMultiselectMenu">
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-all" data-menu-id="tbBatchMultiselectMenu" checked>
                            <strong>Select All Batches</strong>
                        </label>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle js-multiselect-toggle" type="button" data-menu-id="tbLocationsMultiselectMenu">
                        <span>Locations: <strong class="js-selected-text">All Selected</strong></span>
                    </button>
                    <div class="dropdown-menu multiselect-menu p-2" id="tbLocationsMultiselectMenu">
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-all" data-menu-id="tbLocationsMultiselectMenu" checked>
                            <strong>Select All Locations</strong>
                        </label>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle js-multiselect-toggle" type="button" data-menu-id="tbBrowsersMultiselectMenu">
                        <span>Browsers: <strong class="js-selected-text">All Selected</strong></span>
                    </button>
                    <div class="dropdown-menu multiselect-menu p-2" id="tbBrowsersMultiselectMenu">
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-all" data-menu-id="tbBrowsersMultiselectMenu" checked>
                            <strong>Select All Browsers</strong>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Variations Table -->
        <div class="table-responsive" id="tbAreaPanesContainer">
            <table class="table table-hover align-middle table-custom mb-0">
                <thead>
                    <tr>
                        <th>Data Set / Variation</th>
                        <th>Locale</th>
                        <th>Browser</th>
                        <th>Belongs to Batches</th>
                    </tr>
                </thead>
                <tbody id="tbVariationsTableBody">
                    <tr class="tb-entry-row" data-batches="NA Integration STG" data-location="US" data-browser="Chrome">
                        <td class="fw-bold font-mono text-dark">[Data Set 1: US CreditCard]</td>
                        <td><span class="badge bg-light text-dark border">US</span></td>
                        <td><span class="fw-semibold font-size-sm"><i class="fa-brands fa-chrome text-primary me-1"></i> Chrome</span></td>
                        <td><span class="badge badge-status-pass"><i class="fa-solid fa-layer-group me-1"></i> NA Integration STG</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
