<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Batch Overview Fragment -->
<div th:fragment="batchOverview" class="d-flex flex-column gap-4">
    <!-- Filter Toolbar -->
    <div class="card card-custom p-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-bold font-size-sm text-muted"><i class="fa-solid fa-filter text-primary"></i> Directory Filters:</span>
                
                <!-- Environment Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle js-multiselect-toggle" type="button" data-menu-id="batchEnvMultiselectMenu">
                        <span>Environment: <strong class="js-selected-text">All Selected</strong></span>
                    </button>
                    <div class="dropdown-menu multiselect-menu p-2" id="batchEnvMultiselectMenu">
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-all" data-menu-id="batchEnvMultiselectMenu" checked>
                            <strong>Select All Environments</strong>
                        </label>
                        <div class="dropdown-divider"></div>
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-option" data-menu-id="batchEnvMultiselectMenu" value="STG" checked> STG
                        </label>
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-option" data-menu-id="batchEnvMultiselectMenu" value="DEV" checked> DEV
                        </label>
                    </div>
                </div>

                <!-- Locale Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle js-multiselect-toggle" type="button" data-menu-id="batchLocalesMultiselectMenu">
                        <span>Locales: <strong class="js-selected-text">All Selected</strong></span>
                    </button>
                    <div class="dropdown-menu multiselect-menu p-2" id="batchLocalesMultiselectMenu">
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-all" data-menu-id="batchLocalesMultiselectMenu" checked>
                            <strong>Select All Locales</strong>
                        </label>
                        <div class="dropdown-divider"></div>
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-option" data-menu-id="batchLocalesMultiselectMenu" value="US" checked> US
                        </label>
                        <label class="dropdown-item font-size-sm d-flex align-items-center gap-2">
                            <input type="checkbox" class="form-check-input js-chk-option" data-menu-id="batchLocalesMultiselectMenu" value="EU" checked> EU
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <input type="text" class="form-control form-control-sm font-size-sm" placeholder="Search batch or run ID..." id="directorySearchInput">
            </div>
        </div>
    </div>

    <!-- Batch Cards Grid -->
    <div class="row g-3" id="batchCardsGrid">
        <div class="col-md-6 col-lg-4" th:each="batch : ${batches}">
            <div class="card card-custom h-100 batch-card" th:data-env="${batch.environment}" th:data-locales="${batch.localesCsv}" th:data-browsers="${batch.browsersCsv}">
                <div class="card-header bg-transparent d-flex align-items-center justify-content-between py-2">
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-size-sm" th:text="${batch.environment}">STG</span>
                    <span class="font-size-sm text-muted" th:text="${batch.lastExecuted}">2 mins ago</span>
                </div>
                <div class="card-body d-flex flex-column gap-2">
                    <div class="fw-bold font-size-lg" th:text="${batch.name}">NA Integration STG</div>
                    <div class="font-size-sm text-muted" th:text="${batch.description}">Main nightly integration test suite.</div>
                    <div class="d-flex align-items-center gap-2 flex-wrap mt-auto">
                        <span class="badge badge-status-pass" th:text="${batch.latestPassRate}">92% Pass</span>
                        <span class="badge badge-status-known" th:text="${batch.knownBugs}">1 Bug</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Overview Runs Directory Table -->
    <div class="card card-custom p-3">
        <div class="card-header bg-transparent fw-bold font-size-lg border-0 px-0">
            <i class="fa-solid fa-list text-primary me-2"></i> All Executed Test Runs Directory
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle table-custom mb-0">
                <thead>
                    <tr>
                        <th>Run ID</th>
                        <th>Batch Name</th>
                        <th>Environment</th>
                        <th>Timestamp</th>
                        <th>Status Breakdown</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="overviewRunsTableBody">
                    <tr>
                        <td class="font-mono fw-bold text-primary">#1049</td>
                        <td class="fw-semibold">NA Integration STG</td>
                        <td><span class="badge bg-primary-subtle text-primary border">STG</span></td>
                        <td class="font-size-sm text-muted">2026-08-07 14:20:00</td>
                        <td>
                            <div class="d-flex gap-1">
                                <span class="badge badge-status-pass"><i class="fa-solid fa-circle-check"></i> 5</span>
                                <span class="badge badge-status-fixed"><i class="fa-solid fa-wrench"></i> 1</span>
                                <span class="badge badge-status-known"><i class="fa-solid fa-bug"></i> 1</span>
                            </div>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm font-size-sm" 
                                    hx-get="/fragments/run-report.html" 
                                    hx-target="#mainViewContainer" 
                                    hx-swap="innerHTML">
                                <i class="fa-solid fa-chart-line me-1"></i> Open Report
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
