<th:block th:fragment="chatContainerContent">
    <div class="panel-header neo-u-23">
        <div class="panel-title"><i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-purple);"></i> <span>Aura Assistant</span></div>
        <div class="neo-u-24" style="display: flex; gap: 4px; align-items: center;">
            <select class="neo-u-25" id="chatSessionSelect" name="sessionId"
                    hx-get="/api/chat/messages" 
                    hx-target="#chatMessages" 
                    hx-swap="innerHTML"
                    hx-trigger="change"
                    onchange="updateHiddenSessionId(this.value)"
                    style="max-width: 110px; font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);">
                <option th:each="sess : ${chatSessions}" 
                        th:value="${sess.id}" 
                        th:text="${sess.name}"
                        th:selected="${sess.id == currentSessionId}"></option>
            </select>
            <button class="btn-edit" 
                    hx-post="/api/chat/create" 
                    hx-target="#chatContainer" 
                    hx-swap="innerHTML" 
                    title="New Chat"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-edit" 
                    th:hx-post="'/api/chat/rename?id=' + ${currentSessionId}"
                    hx-prompt="Enter new chat session name:"
                    hx-target="#chatContainer"
                    hx-swap="innerHTML"
                    title="Rename Chat"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-edit" 
                    th:hx-post="'/api/chat/delete?id=' + ${currentSessionId}"
                    hx-confirm="Are you sure you want to delete this chat session?"
                    hx-target="#chatContainer"
                    hx-swap="innerHTML"
                    title="Delete Chat" style="color: var(--danger);"><i class="fa-solid fa-trash"></i></button>
        </div>
    </div>
    
    <div class="api-key-banner neo-u-27" id="apiKeyBanner" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="apiKeyBannerText"></span>
    </div>
    <div class="api-key-banner neo-u-28" id="warningBanner" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="warningBannerText"></span>
    </div>

    <div class="chat-messages" id="chatMessages" th:fragment="chatMessages">
        <th:block th:replace="~{fragments/chat :: chatMessagesContent}"></th:block>
    </div>

    <form hx-post="/api/chat" 
          hx-target="#chatMessages" 
          hx-swap="innerHTML" 
          onsubmit="clearChatInput()"
          class="chat-input-form">
        <input type="hidden" name="sessionId" id="hiddenSessionId" th:value="${currentSessionId}"/>
        <div class="chat-input-wrapper">
            <input class="chat-input" id="chatInput" name="prompt" placeholder="Ask Aura anything about your tests..." type="text" autocomplete="off"/>
            <button type="submit" class="chat-send-btn" title="Send Message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </form>
</th:block>

<th:block th:fragment="chatMessagesContent">
    <div th:if="${#lists.isEmpty(chatMessages)}" class="chat-welcome-card">
        <div class="chat-welcome-icon"><i class="fa-solid fa-robot"></i></div>
        <div class="chat-welcome-title">Hello I'm Aura. How can I help you today?</div>
        <div class="chat-welcome-desc">I can select test cases using natural language and help you create new test cases.</div>
        <div class="chat-prompts">
            <button type="button" class="prompt-chip" onclick="setChatPrompt('Select all test cases using the search')"><i class="fa-solid fa-list-check"></i> Select all "search" tests</button>
            <button type="button" class="prompt-chip" onclick="setChatPrompt('Create a test case for searching items')"><i class="fa-solid fa-circle-plus"></i> Create a "search" test</button>
        </div>
    </div>
    
    <div th:each="msg : ${chatMessages}" 
         th:class="'chat-message ' + ${msg.role} + ' message-' + ${msg.role}">
        <div class="chat-message-header">
            <div class="avatar" th:classappend="${msg.role == 'user' ? 'user-avatar' : 'ai-avatar'}">
                <i th:class="${msg.role == 'user' ? 'fa-solid fa-user' : 'fa-solid fa-robot'}"></i>
            </div>
            <span class="sender" th:text="${msg.role == 'user' ? 'You' : 'Aura Assistant'}">Sender</span>
        </div>
        <div th:if="${msg.thinking != null and msg.thinking != ''}" class="thinking-block">
            <details>
                <summary><i class="fa-solid fa-brain" style="color: var(--accent-purple); font-size: 11px;"></i> Thinking Process</summary>
                <pre class="thinking-text" th:text="${msg.thinking}"></pre>
            </details>
        </div>
        <div class="text" th:utext="${msg.content}">Message Content</div>
    </div>
</th:block>
