<!DOCTYPE html>
<!--
  Xceptance Aura Executive Control Center Dashboard
  @author AI-generated: Antigravity
  Xceptance GmbH 2026
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Neodymium Aura Manager</title>
    <!-- Stylesheets, fonts, and scripts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="dashboard-styles.css" rel="stylesheet"/>
    <script src="dashboard-htmx.js"></script>
</head>
<body th:classappend="${theme == 'light' ? 'light-mode' : ''}">

<div class="toast-container" id="toastContainer"></div>

<!-- Sidebar Navigation -->
<div class="sidebar">
    <div class="logo"><i class="fa-solid fa-atom"></i></div>
    <div class="nav-item active" id="navWorkspace" onclick="showView('dashboardView')" title="Workspace Explorer">
        <i class="fa-solid fa-folder-tree"></i>
        <div class="nav-badge neo-u-1" id="sidebarRunBadge" style="display: none;"><i class="fa-solid fa-circle-notch spinner"></i></div>
    </div>
    <div class="nav-item" id="navReports" onclick="showView('reportViewContainer')" title="History &amp; Reports">
        <i class="fa-solid fa-clock-rotate-left"></i>
    </div>
</div>

<div class="main-container" id="mainWorkspace">
    <!-- Top Navbar -->
    <div class="top-navbar" id="themeContainer" th:fragment="themeContainer">
        <div class="neo-u-2">Neodymium Aura Dashboard</div>
        <div class="neo-u-3">
            <div class="neo-u-4">
                <button class="btn-edit neo-u-5" id="settingsBtn" onclick="openSettingsModal()" title="Settings"><i class="fa-solid fa-gear"></i></button>
                <button class="btn-edit neo-u-5" id="themeLight" onclick="changeTheme('light')" title="Light Mode"><i class="fa-solid fa-sun"></i></button>
                <button class="btn-edit neo-u-5" id="themeDark" onclick="changeTheme('dark')" title="Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <button class="btn-edit neo-u-5" id="themeSystem" onclick="changeTheme('system')" title="System Theme"><i class="fa-solid fa-desktop"></i></button>
            </div>
        </div>
    </div>

    <!-- Layout Container: Workspace -->
    <div class="workspace-layout active neo-u-6" id="dashboardView">
        <!-- LEFT AREA -->
        <div class="left-area neo-u-7" id="leftArea">
            <!-- STATE: Selection & Queue -->
            <div class="view-state active" id="state-selection">
                <div class="selection-queue-grid">
                    <!-- Insert Test Selection Panel Fragment -->
                    <div th:replace="~{fragments/test-selection :: testSelectionContent}"></div>
                    
                    <!-- Insert Run Queue Panel Fragment -->
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title"><i class="fa-solid fa-list-ol" style="color: var(--accent);"></i> <span>Run Queue</span></div>
                        </div>
                        <div class="content-scroll">
                            <div class="queue-list" id="queueListContainer" th:fragment="queueListContainer">
                                <div th:replace="~{fragments/queue :: queueListContainerContent}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- STATE: Editor -->
            <div class="view-state" id="state-editor">
                <!-- Insert Editor Panel Fragment -->
                <div class="panel editor-container" id="editorPanel" th:fragment="editorPanel">
                    <div th:replace="~{fragments/editor :: editorPanelContent}"></div>
                </div>
            </div>
            
            <!-- Insert Progress Stats Panel Fragment -->
            <div class="panel neo-u-13" id="statsPanel" th:fragment="statsPanel" hx-swap-oob="true"
                 th:style="${running or (total != null and total > 0) ? 'display: block;' : 'display: none;'}">
                <div th:replace="~{fragments/queue :: statsPanelContent}"></div>
            </div>
            
            <!-- Terminal Panel -->
            <div class="resizer-v neo-u-1" id="consoleResizer"></div>
            <div class="panel neo-u-19" id="consolePanel">
                <div class="terminal-panel">
                    <div class="neo-u-20">
                        <span>TERMINAL OUTPUT <span class="neo-u-1" id="runSpinner"><i class="fa-solid fa-circle-notch spinner neo-u-21"></i></span></span>
                        <div class="neo-u-22">
                            <input checked="" id="aiOnlyCb" onchange="toggleAiOnly(this.checked)" type="checkbox"/>
                            <label for="aiOnlyCb">AI Only</label>
                            <input id="errorsOnlyCb" onchange="toggleErrorsOnly(this.checked)" type="checkbox"/>
                            <label for="errorsOnlyCb">Errors Only</label>
                        </div>
                    </div>
                    <div id="terminalConsole">Console idle.</div>
                </div>
            </div>
        </div>
        
        <!-- HORIZONTAL RESIZER -->
        <div class="resizer-h" id="sidebarResizer"></div>
        
        <!-- RIGHT AREA -->
        <div class="right-area" id="rightArea">
            <!-- Insert Chat Assistant Panel Fragment -->
            <div class="panel chat-container" id="chatContainer" th:fragment="chatContainer">
                <div th:replace="~{fragments/chat :: chatContainerContent}"></div>
            </div>
            
            <!-- Insert Configuration Panel Fragment -->
            <div class="panel config-container">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-sliders" style="color: var(--accent);"></i> <span>Run Configuration</span></div>
                </div>
                <div class="config-panel neo-u-29" id="configPanel" th:fragment="configPanel">
                    <div th:replace="~{fragments/queue :: configPanelContent}"></div>
                </div>
                <div id="runControls" style="display: flex; gap: 8px; margin-top: 12px; padding: 0 16px 16px;">
                    <th:block th:replace="~{fragments/queue :: runControlsContent}"></th:block>
                </div>
            </div>
        </div>
    </div>

    <!-- HISTORY & REPORTS VIEW -->
    <div class="workspace-layout neo-u-34" id="reportViewContainer">
        <!-- Mini-runs status bar -->
        <div class="col-runs-mini" id="colRunsMini">
            <div class="col-runs-mini-header">Runs</div>
        </div>
        <!-- Left Side: History List -->
        <div class="left-area" id="colRuns">
            <div class="panel neo-u-35">
                <div class="panel-header">
                    <span>Run History</span>
                    <button class="btn btn-secondary neo-u-36" hx-get="/api/reporting/history" hx-target="#allureHistoryList" hx-swap="outerHTML"><i aria-hidden="true" class="fa-solid fa-arrows-rotate"></i></button>
                </div>
                <div class="neo-u-37" id="reportingHistoryList">
                    <table class="history-table neo-u-38">
                        <!-- Insert History List Fragment -->
                        <tbody id="allureHistoryList" th:fragment="reportingHistoryList">
                            <th:block th:replace="~{fragments/history :: reportingHistoryListContent}"></th:block>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="resizer-h neo-u-34" id="historyResizer1"></div>
        <!-- Middle Side: Tests List -->
        <div class="left-area" id="colTests" th:fragment="historyTests" hx-on:htmx:after-swap="applyHistoryState(2)">
            <th:block th:replace="~{fragments/history :: historyTestsContent}"></th:block>
        </div>
        <div class="resizer-h neo-u-34" id="historyResizer2"></div>
        <!-- Mini-tests status bar -->
        <div class="col-runs-mini" id="colTestsMini">
            <div class="col-runs-mini-header">Tests</div>
        </div>
        <div class="resizer-h neo-u-34" id="historyResizer3"></div>
        <!-- Right Side: Interactive Console -->
        <div class="right-area neo-u-34" id="colReport">
            <div class="panel neo-u-39">
                <div class="panel-header">
                    <span id="historyDetailsHeader">Test Case Details</span>
                </div>
                <div class="neo-u-40">
                    <iframe class="neo-u-41" id="historyConsoleIframe"></iframe>
                    <div class="neo-u-42" id="historyPlaceholder">
                        <i class="fa-solid fa-clock-rotate-left neo-u-43"></i>
                        <p>Select a run from the history to view its interactive report.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- REPORT IFRAME VIEW (Hidden until report opened) -->
    <div class="iframe-view-pane" id="reportView">
        <div class="neo-report-header">
            <div class="neo-u-44"><i class="fa-solid fa-chart-column neo-u-45"></i>
                Test Report: <span id="reportDisplayName"></span></div>
            <button class="btn-edit" onclick="closeReportView()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        </div>
        <iframe class="report-iframe" id="reportIframe" src="about:blank"></iframe>
    </div>
    
    <!-- INTERACTIVE CONSOLE VIEW -->
    <div class="iframe-view-pane" id="interactiveConsoleView">
        <div class="neo-report-header">
            <div class="neo-u-44"><i class="fa-solid fa-terminal neo-u-46"></i> Interactive Console</div>
            <button class="btn-edit" onclick="closeInteractiveConsoleView()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        </div>
        <iframe class="report-iframe" id="interactiveConsoleIframe" src="about:blank"></iframe>
    </div>
</div>

<!-- MODALS -->
<div th:replace="~{fragments/settings-modal :: settingsModal}"></div>
<div th:replace="~{fragments/modals :: createTestModal}"></div>
<div th:replace="~{fragments/modals :: deleteTestModal}"></div>

<!-- VIEW LOG MODAL -->
<div class="modal-overlay neo-u-49" id="logModal">
    <div class="modal-card neo-u-50">
        <div class="modal-header neo-u-31">
            <span>Execution Log</span>
            <button class="btn-editor neo-u-51" id="downloadLogBtn"><i class="fa-solid fa-download"></i> Download</button>
        </div>
        <div class="modal-body neo-u-52">
            <pre class="neo-u-53" id="logModalContent"></pre>
        </div>
        <div class="modal-footer">
            <button class="btn-primary neo-u-51" onclick="closeLogModal()">Close</button>
        </div>
    </div>
</div>

<!-- Polling Trigger Container -->
<div id="executionTrigger" th:fragment="executionTrigger" hx-swap-oob="true">
    <th:block th:replace="~{fragments/queue :: executionTriggerContent}"></th:block>
</div>

<script src="dashboard-core.js"></script>
<script src="dashboard-history.js"></script>
<script src="dashboard-chat.js"></script>
<script src="dashboard-editor.js"></script>
<script src="dashboard-runner.js"></script>
<script src="dashboard-settings.js"></script>
</body>
</html>
