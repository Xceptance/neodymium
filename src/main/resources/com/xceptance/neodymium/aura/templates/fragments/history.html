<!--
  Xceptance Aura Execution History and Reports Contents Fragment
  @author AI-generated: Antigravity
  Xceptance GmbH 2026
-->
<th:block th:fragment="reportingHistoryListContent">
    <!-- Running row at top -->
    <tr th:if="${running}" class="history-row" style="cursor: pointer; border-left: 3px solid var(--accent);" onclick="openCurrentRunView()">
        <td style="padding: 10px 12px;">
            <div class="run-row-header">
                <span class="run-number">#—</span>
                <span class="run-timestamp" th:text="${runningStartTime}">Running Time</span>
                <span style="background: rgba(59,130,246,0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500;">
                    <i class="fa-solid fa-circle-notch spinner" style="margin-right: 4px;"></i> Running
                </span>
            </div>
        </td>
    </tr>

    <!-- Empty placeholder if no reports -->
    <tr th:if="${#lists.isEmpty(history) and !running}">
        <td style="text-align: center; color: var(--text-secondary); font-style: italic; padding: 20px;">No historical reports.</td>
    </tr>

    <!-- Main loop over history items -->
    <tr th:each="item : ${history}"
        class="history-row"
        th:style="${item.id == reportId ? 'cursor: pointer; background-color: var(--bg-hover); border-left: 3px solid var(--accent);' : 'cursor: pointer;'}"
        th:id="'run-' + ${item.id}"
        th:hx-get="'/api/reporting/run?id=' + ${item.id}"
        hx-target="#colTests"
        hx-swap="outerHTML">
        <td style="padding: 10px 12px;">
            <div class="run-row-header">
                <span class="run-number" th:text="${item.runNumber != null ? '#' + item.runNumber : ''}">#1</span>
                <span class="run-timestamp" th:text="${item.formattedTime}">2026-07-22 14:15:00</span>
                <span th:if="${item.status == 'Passed'}" class="badge-success">Passed</span>
                <span th:if="${item.status == 'Aborted'}" class="badge-aborted">Aborted</span>
                <span th:if="${item.status != 'Passed' and item.status != 'Aborted'}" class="badge-failed" th:text="${item.status}">Failed</span>
                <span th:if="${item.durationLabel != ''}" class="run-duration-chip">
                    <i class="fa-regular fa-clock"></i> <span th:text="${item.durationLabel}">45s</span>
                </span>
            </div>
            <div class="run-stats-row">
                <span class="run-stat-passed"><i class="fa-solid fa-check" aria-hidden="true"></i> <span th:text="${item.passed != null ? item.passed : 0}">1</span> passed</span>
                <span class="run-stat-failed"><i class="fa-solid fa-xmark" aria-hidden="true"></i> <span th:text="${item.failed != null ? item.failed : 0}">0</span> failed</span>
                <span th:if="${item.skipped != null and item.skipped != '0'}" class="run-stat-skipped" style="color:var(--text-muted); font-weight:600;">
                    <i class="fa-solid fa-forward-step" aria-hidden="true"></i> <span th:text="${item.skipped}">0</span> skipped
                </span>
            </div>
            <div class="run-actions-row">
                <button class="run-action-btn"
                        th:disabled="${!item.hasReport or !item.allureEnabled}"
                        th:title="${!item.allureEnabled ? 'Allure was disabled for this run' : (!item.hasReport ? 'Allure report not available' : '')}"
                        th:data-report-id="${item.hasReport ? item.id : ''}"
                        onclick="event.stopPropagation(); const rid = this.getAttribute('data-report-id'); if (rid) { window.open('/api/reporting/report/' + rid + '/allure-report/index.html', '_blank'); }">
                    <i class="fa-solid fa-chart-bar"></i> Allure Report
                </button>
                <button th:if="${item.runConfig != null and !running}" class="run-action-btn"
                        th:data-run-config="${item.runConfigJson}"
                        onclick="event.stopPropagation(); rerunFullRun(this.getAttribute('data-run-config'))"
                        title="Re-run this entire suite with the same configuration">
                    <i class="fa-solid fa-rotate-right"></i> Rerun
                </button>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
                <button class="run-action-btn danger" style="font-size: 10px; padding: 2px 6px; opacity: 0.65;"
                        th:hx-post="'/api/reporting/delete'"
                        th:hx-vals="'{&quot;id&quot;: &quot;' + ${item.id} + '&quot;}'"
                        hx-target="#allureHistoryList"
                        hx-swap="outerHTML"
                        th:hx-confirm="'Are you sure you want to delete report &quot;' + ${item.id} + '&quot;?'"
                        onclick="event.stopPropagation();"
                        title="Delete this run">
                    <i class="fa-solid fa-trash-can"></i> Delete
                </button>
            </div>
            <div th:if="${!item.allureEnabled}" class="run-allure-note">
                <i class="fa-solid fa-circle-info"></i> Allure was disabled for this run
            </div>
        </td>
    </tr>
</th:block>

<div class="panel" th:fragment="historyTestsContent">
    <div class="panel-header">
        <span id="historyTestsHeader" th:text="${selectedRunNumber != null ? 'Test Cases - Run #' + selectedRunNumber : 'Test Cases'}">Test Cases</span>
    </div>
    <div class="neo-u-37" id="historyTestsList">
        <!-- Empty placeholder if no tests -->
        <div th:if="${#lists.isEmpty(tests)}" style="text-align: center; color: var(--text-secondary); font-style: italic; padding: 24px;">No tests available.</div>

        <!-- Iterate over tests -->
        <div th:each="t : ${tests}"
             class="test-card history-row"
             th:data-test-name="${t.name}"
             th:data-report-id="${reportId}"
             th:data-file="${t.file}"
             onclick="loadInteractiveTest(this.getAttribute('data-report-id'), this.getAttribute('data-file'), this.getAttribute('data-test-name'), this)">
            <div class="test-card-title-row">
                <span class="test-card-title" th:text="${t.displayName != null ? t.displayName : t.name}">Login Test</span>
                <span th:if="${t.status == 'Passed'}" class="badge-success">Passed</span>
                <span th:if="${t.status != 'Passed'}" class="badge-failed" th:text="${t.status}">Failed</span>
            </div>
            
            <div style="font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px;" th:text="${t.file}">file.yaml</div>
            
            <div class="test-card-meta-row">
                <span th:if="${t.durationLabel != ''}"><i class="fa-regular fa-clock"></i> <span th:text="${t.durationLabel}">45s</span></span>
                
                <!-- Playbook Badge -->
                <span th:class="'pb-badge ' + ${t.playbookMode != null ? t.playbookMode : 'llm'}">
                    <i th:class="${t.playbookMode == 'playbook' ? 'fa-solid fa-rotate' : (t.playbookMode == 'healing' ? 'fa-solid fa-wrench' : 'fa-solid fa-wand-magic-sparkles')}"></i>
                    <span th:text="${t.playbookMode == 'playbook' ? 'Playbook' : (t.playbookMode == 'healing' ? 'Healing' : 'AI')}">AI</span>
                </span>
            </div>
            
            <!-- Actions (Log / Rerun) -->
            <div th:if="${t.hasLog == 'true' or (t.rerunPayload != null and !running)}" class="test-card-actions">
                <button th:if="${t.hasLog == 'true'}" class="run-action-btn" style="font-size:10px; padding:2px 7px;"
                        th:data-report-id="${reportId}"
                        th:data-test-name="${t.name}"
                        onclick="event.stopPropagation(); openTestLog(this.getAttribute('data-report-id'), this.getAttribute('data-test-name'))"
                        title="View test log">
                    <i class="fa-solid fa-file-lines"></i> Log
                </button>
                <button th:if="${t.rerunPayload != null and !running}" class="run-action-btn" style="font-size:10px; padding:2px 7px;"
                        th:data-payload="${t.rerunPayload}"
                        onclick="event.stopPropagation(); rerunSingleTest(this.getAttribute('data-payload'))"
                        title="Re-run this test case with the same configuration">
                    <i class="fa-solid fa-rotate-right"></i> Rerun
                </button>
            </div>
        </div>
    </div>
</div>
