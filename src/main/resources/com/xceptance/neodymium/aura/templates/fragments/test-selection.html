<!--

  Xceptance GmbH 2026

<div class="panel" th:fragment="testSelectionContent">
    <div class="panel-header">
        <span>Test Selection</span>
        <button class="btn-edit neo-u-8" hx-get="/api/files/list" hx-target="#yamlFileList" hx-swap="outerHTML" title="Refresh Files"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
    <div class="search-container" style="padding: 10px 12px 0 12px; margin-bottom: 0;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="testSearchInput" name="q" placeholder="Search test cases..."
               class="search-input"
               hx-get="/api/files/search" hx-trigger="keyup changed delay:200ms, search"
               hx-target="#yamlFileList" hx-swap="outerHTML"/>
    </div>
    <div class="content-scroll" id="yamlFileList" th:fragment="yamlFileList">
        <div th:replace="~{fragments/test-selection :: yamlFileListContent}"></div>
    </div>
    <div class="neo-u-9">
        <button class="btn-edit neo-u-10" id="openModalBtn" hx-get="/api/modals/create" hx-target="#modalContainer" hx-swap="innerHTML">
            <i class="fa-solid fa-plus"></i> Create New Test
        </button>
    </div>
</div>

<th:block th:fragment="yamlFileListContent">
    <!-- If files is null or empty, display a message -->
    <div th:if="${files == null or files.isEmpty()}" class="empty-state-card">
        <i class="fa-solid fa-folder-open"></i>
        <div class="empty-title">No Test Files Found</div>
        <div class="empty-desc">No YAML test files were found in src/test/resources.</div>
    </div>

    <!-- Otherwise, render the list using Thymeleaf loop -->
    <th:block th:unless="${files == null or files.isEmpty()}">
        <div class="file-container" th:each="item : ${files}" style="display: flex; flex-direction: column; margin-bottom: 6px;">
            <div class="list-item" style="position: relative; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;" tabindex="0"
                 th:data-file="${item.file}"
                 hx-get="/api/files/expand" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;}'}"
                 hx-target="#yamlFileList" hx-swap="outerHTML">
                <div class="item-main" style="min-width: 0; overflow: hidden; display: flex; align-items: center; flex-grow: 1;">
                    <i class="fa-solid" 
                       th:classappend="${#sets.contains(expandedFiles, item.file) ? 'fa-chevron-down' : 'fa-chevron-right'}"
                       style="margin-right: 8px; color: var(--text-secondary); font-size: 10px; width: 12px; text-align: center;"></i>
                    <label class="custom-checkbox" onclick="event.stopPropagation();">
                        <input type="checkbox" class="file-select-cb" th:data-file="${item.file}" 
                               hx-post="/api/queue/toggleAll" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;}'}"
                               hx-target="#queueListContainer" hx-swap="innerHTML">
                    </label>
                    <span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 6px;" th:text="${item.file}">filename.yaml</span>
                </div>
                <button class="edit-icon-btn" th:data-file="${item.file}"
                        hx-get="/api/editor" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;}'}"
                        hx-target="#editorPanel" hx-swap="outerHTML" onclick="event.stopPropagation();"
                        style="padding: 4px 8px; color: var(--text-secondary);" 
                        th:title="'Edit YAML Steps for ' + ${item.file}" th:alt="'Edit YAML Steps for ' + ${item.file}" th:aria-label="'Edit YAML Steps for ' + ${item.file}">
                    <i class="fa-solid fa-pen" style="font-size: 11px;" aria-hidden="true"></i>
                </button>
            </div>
            
            <div class="dataset-list" th:id="'datasets-' + ${item.file}" th:style="'display: ' + (${#sets.contains(expandedFiles, item.file) ? 'flex' : 'none'}) + '; flex-direction: column; padding-left: 24px; margin-top: 4px; gap: 4px;'">
                <div class="dataset-item" th:each="dataset : ${item.datasets}" style="display: flex; align-items: center; padding: 4px 8px; border-radius: 6px; font-size: 12px; justify-content: space-between; cursor: pointer;" th:data-file="${item.file}" th:data-id="${dataset.id}">
                    <div style="display: flex; align-items: center; min-width: 0; overflow: hidden;">
                        <label class="custom-checkbox" onclick="event.stopPropagation();">
                            <input type="checkbox" class="dataset-select-cb" th:data-file="${item.file}" th:data-id="${dataset.id}" 
                                   hx-post="/api/queue/toggle" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;,\&quot;id\&quot;:\&quot;' + dataset.id + '\&quot;}'}"
                                   hx-target="#queueListContainer" hx-swap="innerHTML">
                        </label>
                        <i class="fa-solid fa-database" style="margin-left: 8px; margin-right: 6px; color: var(--accent); opacity: 0.7; flex-shrink: 0;"></i>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 2px;" th:text="${dataset.label}">dataset label</span>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
