<!--

<div class="panel" th:fragment="testSelectionContent">
    <div class="panel-header">
        <div class="panel-title"><span class="material-symbols-outlined" style="color: var(--accent);">checklist</span> <span>Test Selection</span></div>
        <button class="btn-edit neo-u-8" hx-get="/api/files/list" hx-target="#yamlFileList" hx-swap="innerHTML" title="Refresh Files"><span class="material-symbols-outlined">sync</span></button>
    </div>
    <div class="search-container">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="testSearchInput" name="q" placeholder="Search test cases..."
               class="search-input"
               hx-get="/api/files/search" hx-trigger="keyup changed delay:200ms, search"
               hx-target="#yamlFileList" hx-swap="innerHTML"/>
    </div>
    <div class="content-scroll" id="yamlFileList" th:fragment="yamlFileList">
        <div th:replace="~{fragments/test-selection :: yamlFileListContent}"></div>
    </div>
    <div class="panel-footer" style="padding: 10px 12px; border-top: 1px solid var(--border);">
        <button class="btn-edit" id="openModalBtn" hx-get="/api/modals/create" hx-target="#modalContainer" hx-swap="innerHTML" style="width: 100%; justify-content: center; padding: 8px; font-weight: 500;">
            <span class="material-symbols-outlined">add</span> Create New Test
        </button>
    </div>
</div>

<th:block th:fragment="yamlFileListContent">
    <!-- If files is null or empty, display a message -->
    <div th:if="${files == null or files.isEmpty()}" class="empty-state-card">
        <span class="material-symbols-outlined">folder_open</span>
        <div class="empty-title">No Test Files Found</div>
        <div class="empty-desc">No YAML test files were found in src/test/resources.</div>
    </div>

    <!-- Otherwise, render the list using Thymeleaf loop -->
    <th:block th:unless="${files == null or files.isEmpty()}">
        <div class="file-container" th:each="item : ${files}" th:data-file="${item.file}" style="display: flex; flex-direction: column; margin-bottom: 6px;">
            <div class="list-item" style="position: relative; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;" tabindex="0"
                 th:data-file="${item.file}"
                 onclick="if(typeof toggleExpandFile==='function') toggleExpandFile(this.getAttribute('data-file'), this);">
                <div class="item-main" style="min-width: 0; overflow: hidden; display: flex; align-items: center; flex-grow: 1;">
                    <span class="material-symbols-outlined" 
                          th:text="${#sets.contains(expandedFiles, item.file) ? 'keyboard_arrow_down' : 'keyboard_arrow_right'}"
                          style="margin-right: 8px; color: var(--text-secondary); font-size: 16px; width: 16px; text-align: center;"></span>
                    <label class="custom-checkbox" onclick="event.stopPropagation();">
                        <input type="checkbox" class="file-select-cb" th:data-file="${item.file}" 
                               th:checked="${selectedFileKeys != null and selectedFileKeys.contains(item.file)}"
                               th:data-indeterminate="${partiallySelectedFileKeys != null and partiallySelectedFileKeys.contains(item.file)}"
                               onchange="if(typeof toggleFileCheckboxesInstant==='function') toggleFileCheckboxesInstant(this);"
                               hx-post="/api/queue/toggleAll" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;}'}"
                               hx-target="#queueListContainer" hx-swap="innerHTML">
                    </label>
                    <span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 6px;" th:text="${item.file}">filename.yaml</span>
                </div>
                <button class="edit-icon-btn" th:data-file="${item.file}"
                        hx-get="/api/editor" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;}'}"
                        hx-target="#editorPanel" hx-swap="outerHTML"
                        onclick="event.stopPropagation(); if(typeof openYamlEditor==='function') openYamlEditor(this.getAttribute('data-file'));"
                        style="padding: 4px 8px; color: var(--text-secondary);" 
                        th:title="'Edit YAML Steps for ' + ${item.file}" th:alt="'Edit YAML Steps for ' + ${item.file}" th:aria-label="'Edit YAML Steps for ' + ${item.file}">
                    <span class="material-symbols-outlined" style="font-size: 16px;" aria-hidden="true">edit</span>
                </button>
            </div>
            
            <div class="dataset-list" th:id="'datasets-' + ${item.file}" th:style="'display: ' + (${#sets.contains(expandedFiles, item.file) ? 'flex' : 'none'}) + '; flex-direction: column; padding-left: 24px; margin-top: 4px; gap: 4px;'">
                <div class="dataset-item" th:each="dataset : ${item.datasets}" style="display: flex; align-items: center; padding: 4px 8px; border-radius: 6px; font-size: 12px; justify-content: space-between; cursor: pointer;" th:data-file="${item.file}" th:data-id="${dataset.id}" onclick="const cb = this.querySelector('.dataset-select-cb'); if (cb &amp;&amp; event.target !== cb &amp;&amp; !event.target.closest('.custom-checkbox')) { cb.click(); }">
                    <div style="display: flex; align-items: center; min-width: 0; overflow: hidden;">
                        <label class="custom-checkbox" onclick="event.stopPropagation();">
                            <input type="checkbox" class="dataset-select-cb" th:data-file="${item.file}" th:data-id="${dataset.id}" 
                                   th:checked="${selectedKeys != null and selectedKeys.contains(item.file + '::' + dataset.id)}"
                                   onchange="if(typeof toggleDatasetCheckboxInstant==='function') toggleDatasetCheckboxInstant(this);"
                                   hx-post="/api/queue/toggle" th:hx-vals="${'{\&quot;file\&quot;:\&quot;' + item.file + '\&quot;,\&quot;id\&quot;:\&quot;' + dataset.id + '\&quot;}'}"
                                   hx-target="#queueListContainer" hx-swap="innerHTML">
                        </label>
                        <span class="material-symbols-outlined" style="margin-left: 8px; margin-right: 6px; color: var(--accent); opacity: 0.7; flex-shrink: 0; font-size: 14px;">database</span>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 2px;" th:text="${dataset.label}">dataset label</span>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
