<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- CREATE TEST MODAL FRAGMENT -->
<div class="modal-overlay" id="createTestModal" th:fragment="createTestModal" style="display: none;" th:style="${error != null} ? 'display: flex;' : null">
    <div class="modal-card">
        <div class="modal-header" id="modalTitle">Create New Test Case</div>
        <form hx-post="/api/create" hx-target="#createTestModal" hx-swap="outerHTML">
            <div class="modal-body">
                <label class="neo-u-47">Test Case Name</label>
                <input class="modal-input" id="newTestName" name="name" placeholder="e.g. Add Product to Basket" type="text" required autofocus/>
                <div id="createTestError" class="error-message" style="color: var(--color-danger, #ef4444); margin-top: 8px; font-size: 0.875rem;" th:if="${error != null}" th:text="${error}"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-editor" id="closeModalBtn" onclick="document.getElementById('createTestModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn-primary neo-u-48" id="submitCreateTestBtn">Create Test</button>
            </div>
        </form>
    </div>
</div>

<!-- DELETE CONFIRMATION MODAL FRAGMENT -->
<div class="modal-overlay" id="deleteTestModal" th:fragment="deleteTestModal" style="display: none;" th:style="${fileToDelete != null} ? 'display: flex;' : null">
    <div class="modal-card">
        <div class="modal-header">Delete Test Case</div>
        <form hx-post="/api/delete" hx-target="#deleteTestModal" hx-swap="outerHTML">
            <input type="hidden" name="file" id="deleteFileNameInput" th:value="${fileToDelete}"/>
            <div class="modal-body">
                <p>Are you sure you want to delete <span class="neo-u-44" id="deleteFileNameDisplay" th:text="${fileToDelete}"></span>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-editor" onclick="document.getElementById('deleteTestModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn-danger neo-u-48">Confirm Delete</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
