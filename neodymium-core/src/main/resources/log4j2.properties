##############################################################################
##
## log4j Settings
##
## The log4j configuration used by Neodymium when running the tests.
##
##############################################################################
#
### Logger definitions ###

status = WARN
name = NeodymiumConfiguration

property.filename = target/log/neodymium-error.log

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p - %c{1.}: %m%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = trace
appender.console.immediateFlush = true
appender.console.follow = true


appender.ai_console.type = Console
appender.ai_console.name = AI_STDOUT
appender.ai_console.layout.type = PatternLayout
appender.ai_console.layout.pattern = %d{HH:mm:ss} %m%n
appender.ai_console.filter.threshold.type = ThresholdFilter
appender.ai_console.filter.threshold.level = debug
appender.ai_console.immediateFlush = true
appender.ai_console.follow = true
 
appender.file.type = File
appender.file.name = FILE
appender.file.append = true
appender.file.fileName = ${filename}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d %p - %c{1.} [%t]: %m%n
appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = error

appender.ai_file.type = File
appender.ai_file.name = AI_FILE
appender.ai_file.append = true
appender.ai_file.fileName = target/neodymium-ai.log
appender.ai_file.layout.type = PatternLayout
appender.ai_file.layout.pattern = %d %p - %c{1.} [%t]: %m%n

appender.server_file.type = File
appender.server_file.name = SERVER_FILE
appender.server_file.append = true
appender.server_file.fileName = target/neodymium-server.log
appender.server_file.layout.type = PatternLayout
appender.server_file.layout.pattern = %d %p - %c{1.} [%t]: %m%n

appender.ai_communication_file.type = File
appender.ai_communication_file.name = AI_COMMUNICATION_FILE
appender.ai_communication_file.append = true
appender.ai_communication_file.fileName = target/neodymium-ai-communication.log
appender.ai_communication_file.createOnDemand = true
appender.ai_communication_file.immediateFlush = true
appender.ai_communication_file.layout.type = PatternLayout
appender.ai_communication_file.layout.pattern = %d %p - %c{1.} [%t]: %m%n

logger.org_neodymium_ai.name = org.neodymium.ai
logger.org_neodymium_ai.level = trace
logger.org_neodymium_ai.additivity = false
logger.org_neodymium_ai.appenderRef.ai.ref = AI_FILE
logger.org_neodymium_ai.appenderRef.ai.level = trace
logger.org_neodymium_ai.appenderRef.console.ref = AI_STDOUT
logger.org_neodymium_ai.appenderRef.console.level = debug
logger.org_neodymium_ai.appenderRef.file.ref = FILE
logger.org_neodymium_ai.appenderRef.file.level = error

logger.org_neodymium_ai_communication.name = org.neodymium.ai.client.communication
logger.org_neodymium_ai_communication.level = off
logger.org_neodymium_ai_communication.additivity = false
logger.org_neodymium_ai_communication.appenderRef.comm.ref = AI_COMMUNICATION_FILE

logger.org_embedded_server.name = org.neodymium.ai.util.EmbeddedHtmlServer
logger.org_embedded_server.level = debug
logger.org_embedded_server.additivity = false
logger.org_embedded_server.appenderRef.server.ref = SERVER_FILE

rootLogger.level = INFO
rootLogger.appenderRef.file.ref = FILE
rootLogger.appenderRef.console.ref = STDOUT
