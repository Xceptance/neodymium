# @author Xceptance GmbH 2026

_properties:
  neodymium.ai.contextLevel: STANDARD

steps: |
  Open ${verla.url}/verla-tailwind-by-claude/index.html
  Validate that 'United States' is shown as the current country context.

  Locate the first product card:
    - Click its 'Add to Cart' button
    - Click the size 'L' button
  The mini cart quantity is now 1.
  
  Hover over the mini cart and click the 'View Cart & Checkout' button.
  The headline says now 'Cart'.
  We see a single lineitem on the left, and an order summary box on the right (visual).
  Capture the subtotal in 'subtotal'.

  Increase the quantity by 1.
  Verify that the new subtotal is 2 * ${subtotal}.
  Capture the new subtotal in 'subtotal'.

  Go to the checkout.
  The headline says 'Checkout'.
  There is a form with address data.
  Verify that the order summary shows the ${subtotal}.

  Fill out the contact form:
    - Enter 'Mario' as first name, 'Meier' as last, and the email address '${guestEmail}'.

  Fill out the shipping address form:
    - Enter '123 Main St' as street address, 'Manchester' as city, and '12345' as postcode.
    - Select 'United States' as country.
    - Enter state 'MA'.

  Fill out the payment detail:
    - Card number is '4111 1111 1111 1111', expiry data '12/29', and CVV is '111'.

  Click 'Purchase'.
  Wait for text "Thank you for your purchase!" to appear.

  Scroll up as much as possible to reveal the full order confirmation.
  An order number is shown in the form 'V-[0-9]+-US'.
  The total is mentioned and in USD.
  The zip code says '12345'.
  The text "Thank you for your purchase!" is shown.
  There is a green checkmark in the middle of the screen (visual).

data:
  - testId: "tailwind-by-claude"
    quality: "tailwind-by-claude"
    email: "user-tailwind-by-claude@example.com"
    guestEmail: "guest-tailwind-by-claude@example.com"

