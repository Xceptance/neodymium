<div class="account-container" id="account-page-container" style="display: flex; gap: 36px; align-items: flex-start; flex-wrap: wrap;">
    <!-- Left Navigation Sidebar -->
    <aside class="account-sidebar" style="flex: 1; min-width: 220px; background: #FAF9F6; border: 1px solid var(--color-border); padding: 24px; border-radius: 6px;">
        <h3 style="font-family: var(--font-family-serif); font-size: 20px; margin-bottom: 20px; font-weight: 700; color: #005699;">Dashboard</h3>
        
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px;">
            <li><button onclick="showAccountTab('orders')" id="tab-btn-orders" style="font-weight: 700; color: #005699; text-align: left; width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0;">📦 ${lang_orderHistory}</button></li>
            <li><button onclick="showAccountTab('addresses')" id="tab-btn-addresses" style="font-weight: 500; color: #555; text-align: left; width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0;">🏠 ${lang_manageAddresses}</button></li>
            <li><button onclick="showAccountTab('cards')" id="tab-btn-cards" style="font-weight: 500; color: #555; text-align: left; width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0;">💳 ${lang_manageCards}</button></li>
            <li><button onclick="showAccountTab('password')" id="tab-btn-password" style="font-weight: 500; color: #555; text-align: left; width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0;">🔑 ${lang_changePassword}</button></li>
            <li style="border-top: 1px solid var(--color-border); padding-top: 12px; margin-top: 8px;"><a href="api/auth/logout" style="color: var(--color-error); font-weight: 600; display: flex; align-items: center; gap: 8px;">🚪 ${lang_logout}</a></li>
        </ul>
    </aside>

    <!-- Right Dashboard Area -->
    <section class="account-main" id="account-dashboard-content" style="flex: 3; min-width: 320px;">
        <!-- 1. Orders Tab -->
        <div class="account-tab-panel" id="tab-panel-orders">
            <h2 style="font-family: var(--font-family-serif); font-size: 24px; font-weight: 700; color: #005699; margin-bottom: 20px;">${lang_orderHistory}</h2>
            <div style="display: flex; flex-direction: column; gap: 20px;">
                ${account_orders_html}
            </div>
        </div>

        <!-- 2. Address Book Tab -->
        <div class="account-tab-panel" id="tab-panel-addresses" style="display: none;">
            <h2 style="font-family: var(--font-family-serif); font-size: 24px; font-weight: 700; color: #005699; margin-bottom: 20px;">${lang_manageAddresses}</h2>
            
            <div id="address-list-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px;">
                ${account_addresses_html}
            </div>

            <div style="background-color: #FAF9F6; border: 1px solid var(--color-border); padding: 24px; border-radius: 6px; max-width: 500px;">
                <h3 style="font-family: var(--font-family-serif); font-size: 18px; margin-bottom: 16px; color: #005699;">Add New Address</h3>
                <form hx-post="api/auth/address/add" hx-target="#account-page-container" hx-swap="outerHTML">
                    <div style="margin-bottom: 14px;">
                        <label for="address-country" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_country}</label>
                        <select id="address-country" name="country" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required
                                hx-get="api/address-form" hx-target="#address-form-fields" hx-trigger="change">
                            ${country_options_html}
                        </select>
                    </div>

                    <div id="address-form-fields">
                        ${address_fields_html}
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 10px 20px; margin-top: 10px; background: #005699;">
                        ${lang_addAddress}
                    </button>
                </form>
            </div>
        </div>

        <!-- 3. Credit Cards Tab -->
        <div class="account-tab-panel" id="tab-panel-cards" style="display: none;">
            <h2 style="font-family: var(--font-family-serif); font-size: 24px; font-weight: 700; color: #005699; margin-bottom: 20px;">${lang_manageCards}</h2>
            
            <div id="card-list-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px;">
                ${account_cards_html}
            </div>

            <div style="background-color: #FAF9F6; border: 1px solid var(--color-border); padding: 24px; border-radius: 6px; max-width: 500px;">
                <h3 style="font-family: var(--font-family-serif); font-size: 18px; margin-bottom: 16px; color: #005699;">Add Credit Card</h3>
                <form hx-post="api/auth/card/add" hx-target="#account-page-container" hx-swap="outerHTML">
                    <div style="margin-bottom: 14px;">
                        <label for="newCardType" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_cardType}</label>
                        <select id="newCardType" name="cardType" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required>
                            <option value="Visa">Visa</option>
                            <option value="Mastercard">Mastercard</option>
                            <option value="American Express">American Express</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label for="newCardNumber" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_cardNum}</label>
                        <input type="text" id="newCardNumber" name="cardNumber" placeholder="1234 5678 1234 5100" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <div>
                            <label for="newCardExpiry" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_expiry}</label>
                            <input type="text" id="newCardExpiry" name="cardExpiry" placeholder="12/28" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required>
                        </div>
                        <div>
                            <label for="newCardCvv" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_cvv}</label>
                            <input type="text" id="newCardCvv" name="cardCvv" placeholder="123" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 10px 20px; margin-top: 16px; background: #005699;">
                        ${lang_addCard}
                    </button>
                </form>
            </div>
        </div>

        <!-- 4. Change Password Tab -->
        <div class="account-tab-panel" id="tab-panel-password" style="display: none;">
            <h2 style="font-family: var(--font-family-serif); font-size: 24px; font-weight: 700; color: #005699; margin-bottom: 20px;">${lang_changePassword}</h2>
            
            <div style="background-color: #FAF9F6; border: 1px solid var(--color-border); padding: 24px; border-radius: 6px; max-width: 440px;">
                <form hx-post="api/auth/password/change" hx-target="#account-page-container" hx-swap="outerHTML">
                    <div style="margin-bottom: 14px;">
                        <label for="currentPassword" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_currentPassword}</label>
                        <input type="password" id="currentPassword" name="currentPassword" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required>
                        <div style="color:var(--color-error); font-size:12px; margin-top:4px;">${err_currentPassword}</div>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label for="newPassword" style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:6px;">${lang_newPassword}</label>
                        <input type="password" id="newPassword" name="newPassword" style="width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:4px; font-size:14px; background:#fff;" required minlength="6">
                        <div style="color:var(--color-error); font-size:12px; margin-top:4px;">${err_newPassword}</div>
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 10px 20px; margin-top: 10px; background: #005699;">
                        ${lang_changePassword}
                    </button>
                </form>
            </div>
        </div>
    </section>
</div>

<script>
    function showAccountTab(tabName) {
        document.querySelectorAll('.account-tab-panel').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.account-sidebar button').forEach(b => {
            b.style.fontWeight = '500';
            b.style.color = '#555';
        });
        const activePanel = document.getElementById('tab-panel-' + tabName);
        if (activePanel) activePanel.style.display = 'block';
        const activeBtn = document.getElementById('tab-btn-' + tabName);
        if (activeBtn) {
            activeBtn.style.fontWeight = '700';
            activeBtn.style.color = '#005699';
        }
    }
</script>
