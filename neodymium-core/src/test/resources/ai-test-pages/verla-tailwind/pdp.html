<div class="mb-6 text-xs text-neutral-500 uppercase tracking-wider">
    <a href="index.html" class="hover:text-terracotta-500 transition-colors">${lang_home}</a> &middot; 
    <a href="c/${product_category}.html" class="hover:text-terracotta-500 transition-colors">${product_category_name}</a> &middot; 
    <span class="text-neutral-900 font-medium">${product_name}</span>
</div>

<div class="pdp-container">
    <!-- Product Image (Large SVG Silhouette) -->
    <div class="pdp-image-wrapper">
        ${product_badge_html}
        <svg viewBox="0 0 100 100" class="w-full max-w-xs h-auto text-terracotta-500">
            ${product_svg_content}
        </svg>
    </div>

    <!-- Product Info Details -->
    <div class="pdp-info-wrapper">
        <span class="text-xs font-semibold uppercase text-neutral-400 tracking-widest mb-2 block">${product_subcategory_name}</span>
        <h1 class="font-serif text-3xl md:text-4xl font-semibold leading-snug mb-4 text-neutral-900">${product_name}</h1>
        
        <!-- Local Price Display -->
        <div class="text-xl font-semibold text-neutral-900 mb-6">
            ${product_price_html}
        </div>

        <p class="text-neutral-600 leading-relaxed mb-8 border-t border-sand-200 pt-6 text-sm">
            ${product_desc}
        </p>

        <!-- Add to Cart Form (HTMX Dynamic badge update) -->
        <form hx-post="api/cart/add" hx-target="#cart-btn-wrapper" hx-swap="outerHTML" class="border-t border-sand-200 pt-6">
            <input type="hidden" name="productId" value="${product_id}">
            
            <div class="flex gap-6 items-center mb-6 flex-wrap">
                ${product_sizes_html}

                <div class="flex gap-3 items-center">
                    <label for="quantity" class="text-xs font-semibold uppercase tracking-wider text-neutral-800">${lang_quantity}:</label>
                    <select name="quantity" id="quantity" class="px-4 py-2.5 border border-sand-200 rounded-lg bg-white outline-none cursor-pointer text-xs focus:border-terracotta-500 text-neutral-800">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full justify-center py-4 text-sm font-semibold flex items-center gap-2.5">
                <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2" ry="2"></rect><path d="M16 8a4 4 0 0 0-8 0"></path></svg> ${lang_addToCart}
            </button>
        </form>
    </div>
</div>
