<section class="mx-auto max-w-2xl py-10 px-4">
    <span class="text-xs font-bold uppercase tracking-[0.15em] text-terracotta-500">Customer Concierge</span>
    <h1 class="font-serif text-4xl font-bold text-espresso mt-1 mb-6">Contact Us</h1>
    <p class="text-sm text-muted mb-8 leading-relaxed">
        Our client advisors are available Monday through Saturday to assist with styling, sizing, and order management.
    </p>

    <div class="bg-sand-50 p-8 rounded-2xl border border-sand-200">
        <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent to our client concierge.');" class="space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="contact-name" class="block font-bold uppercase tracking-wider mb-2 text-ink">Your Name</label>
                    <input type="text" id="contact-name" required placeholder="Elena Rossi" class="w-full px-4 py-3 rounded-lg border border-sand-200 bg-white">
                </div>
                <div>
                    <label for="contact-email" class="block font-bold uppercase tracking-wider mb-2 text-ink">Email Address</label>
                    <input type="email" id="contact-email" required placeholder="elena@example.com" class="w-full px-4 py-3 rounded-lg border border-sand-200 bg-white">
                </div>
            </div>
            <div>
                <label for="contact-message" class="block font-bold uppercase tracking-wider mb-2 text-ink">Message</label>
                <textarea id="contact-message" required rows="4" placeholder="How can we assist you with your order?" class="w-full px-4 py-3 rounded-lg border border-sand-200 bg-white"></textarea>
            </div>
            <button type="submit" class="px-6 py-3 bg-terracotta-500 hover:bg-terracotta-600 text-white font-bold uppercase tracking-wider rounded-lg shadow-md transition-colors">
                Send Inquiry
            </button>
        </form>
    </div>
</section>
