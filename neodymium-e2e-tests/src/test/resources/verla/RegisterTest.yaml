steps: |
  Open ${verla.url}/verla-${quality}/index.html
  Open the country selector and click "${country}".
  Verify that the page now display most of the content in the language of "${country}" (visual).
  Check that the country flag is the flag of "${country}".
  Go to the login page.
  Click the link underneath the login button to register a new account.
  Assert that the registration form with the confirm password field is visible.
  Validate that the account registration page is visible with three input fields.
  Type "${email}" into the email address field, "${password}" into the password field and "${password}" into the confirm password field.
  Click the registration submit button.
  The user account page is displayed with the order history section and logout option (visual).
  There is a link on the left side that allows to log out.
  Visually, you will see a bordered area on the left with text and icons, as well as a white area on the right (visual).

