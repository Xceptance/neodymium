steps: |
  Open ${verla.url}/verla-${quality}/index.html
  Validate that United States as country is selected.
  The homepage has a top banner with some advertising (visual)
  The homepage has a menu that features the "VERLA." logo, categories, a search bar, a country selector, a login button, and a cart section (visual)
  The cart currently displays 0 items.
  The main part of the homepage is a large banner with a CTA button, a section of featured categories, and featured essentials (visual: full).
  The products displayed have an image, a product name, and a price in the country's currency (visual: full).
  At the bottom, there is a footer with a VERLA description text, a shop, a support, and a contact section.
  The last row of the screen contains copyright, and terms and privacy links.
  

data:
  - testId: "perfect"
    quality: "perfect"
  - testId: "normal"
    quality: "normal"
  - testId: "bad"
    quality: "bad"
